  package: '@progress/kendo-react-mcp'
  registry: npm
  version: 1.10.2
  auth: 'Telerik license, supplied as TELERIK_LICENSE_PATH (path to a license file) or TELERIK_LICENSE
    (license key string) in the MCP client environment'
  docs: https://www.telerik.com/kendo-react-ui/components/ai-assistant/mcp-server
  tools:
  - name: kendo_ui_generator
    description: Generates KendoReact UI from a natural-language request, grounded in the component
