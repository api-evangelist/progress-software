  install: npx -y @progress/kendo-react-mcp@latest
  package: https://www.npmjs.com/package/@progress/kendo-react-mcp
  auth: api-key
  verified: searched
note: 'Progress ships NO hosted/remote MCP endpoint. Every MCP server in the portfolio is something the
  customer installs and runs: the Telerik / Kendo UI servers are stdio processes launched by an MCP
  client via npx (npm) or from NuGet, and the OpenEdge MCP Server is a container the customer deploys
  inside its own OpenEdge estate. An agent cannot reach any Progress MCP surface without a human
  installing and licensing it first. mcp.progress.com and mcp.telerik.com do not resolve (NXDOMAIN,
  probed 2026-09-13).'
servers:
