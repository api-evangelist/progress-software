headline: 'Progress''s MCP surface and Progress''s API surface do not touch. Every MCP tool the company
  ships belongs to the Telerik/Kendo developer-tooling brand and generates UI code; every published
  REST operation belongs to Chef Automate, MOVEit Transfer or WhatsUp Gold. Zero of 558 REST
  operations has an MCP tool, and zero MCP tools have a backing REST operation. This is not a coverage
  gap to be closed — it is two unrelated product lines, and the crosswalk exists to record that
  plainly rather than let an aggregate "has MCP + has OpenAPI" reading imply an agent can drive the
  Progress APIs.'
