            type: string
        kprop:
          description: The "kprop" (key property)parameter contains a list of properties this key fulfills. (Required)
          type: array
          items:
            type: string
        expiration_time:
          format: date-time
          description: last time this key can be used to sign new objects
          type: string
        kid:
          description: 'The "kid" (key ID) Header Parameter is a hint indicating which key was used to secure the JWS.This parameter allows originators to explicitly signal a change of key to recipients.The structure of the "kid" value is unspecified.Its value MUST be a case-sensitive string. Use of this Header Parameter is REQUIRED.

            Current suggested implementation is limited to 150 characters. (required)'
          type: string
        alg:
          description: The "alg" (algorithm) identifies the cryptographic algorithm used. (required)
          type: string
        kver:
          description: The "kver" (key version) parameter contains the current version of the key. If empty, version will be "0.0.0". (Optional)
          type: string
        issue_time:
          format: date-time
          description: date at which this key will or became active
          type: string
    RoleResource:
      description: Pointer to another role in the system. Only id is required.
      type: object
      properties:
        name:
          description: Name of a role
          type: string
        kind:
          description: Type of role being referred to since names are unique based on kind.
          enum:
          - all
          - role
          - brandModel
          - os
          - subRole
          - monitor
          - template
          - interfaceFilter
          - deviceFilter
          - monitorCriteria
          type: string
        internalName:
          description: A unique name the role is known by. Normally used in OS roles
          type: string
        id:
          type: string
    PackageKeyUsage:
      description: Use of key for package
      type: object
      properties:
        usage:
          description: 'usage for key signing. If empty, key will be used for all items it is capable of.

            If conflicting usage, system will choose which to use'
          type: array
          items:
            type: string
        key:
          $ref: '#/components/schemas/PackageSignerId'
          description: key information
    PackageGenKeyRequest:
      description: Provide data for generation of vendor key request, obfuscation key will be required
      type: object
      properties:
        kid:
          description: 'The "kid" (key ID) Header Parameter is a hint indicating which key was used to secure the JWS.This parameter allows originators to explicitly signal a change of key to recipients.The structure of the "kid" value is unspecified.Its value MUST be a case-sensitive string. Use of this Header Parameter is REQUIRED.

            Current suggested implementation is limited to 150 characters. (required)'
          type: string
        kver:
          description: The "kver" (key version) parameter contains the current version of the key. If empty, version will be "0.0.0". (Optional)
          type: string
        name:
          description: The "name" for the key. For use with acceptance dialog shown to the end user. (optional)
          type: string
        description:
          description: The "description" of the key. May be used with acceptance dialog shown to the end user.  (Optional)
          type: string
        allowed:
          description: "list of features the new key will inherit from the signer and is allowed to sign. \nThe key up the chain is only allowed to pass on features it is assigned. \nThe ability to generate new keys cannot be transfered and is reserved as a \"base key\" ability only."
          type: array
          items:
            type: string
        priority:
          format: int32
          description: 'The "priority" determine which key is preferred when signing. Priority is used when the kprop of "private" is set.

            The parameter consists of an unsigned integer value and should not be included in a normalized key signature

            If empty, will be assumed to be lowest priority. (optional)'
          type: integer
        expiration_days:
          format: int32
          description: 'number of days the new key will be allowed to issues related keys

            null or less than 1 defaults to 366 days'
          type: integer
        okey:
          description: when not empty, this key will be used to obfuscate the generated private key,
          type: string
    CustomPerformanceMonitor:
