        kid:
          description: 'The "kid" (key ID) Header Parameter is a hint indicating which key was used to secure the JWS.This parameter allows originators to explicitly signal a change of key to recipients.The structure of the "kid" value is unspecified.Its value MUST be a case-sensitive string. Use of this Header Parameter is REQUIRED.

            Current suggested implementation is limited to 150 characters. (required)'
          type: string
        alg:
          description: The "alg" (algorithm) identifies the cryptographic algorithm used. (required)
          type: string
        kver:
          description: The "kver" (key version) parameter contains the current version of the key. If empty, version will be "0.0.0". (Optional)
          type: string
        issue_time:
          format: date-time
