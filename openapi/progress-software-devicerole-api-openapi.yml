openapi: 3.2.0
info:
  version: v1
  title: WhatsUp Gold Device Role API
  x-logo:
    url: images/wug_logo.svg
  description: '**Version 2026.0**


    *Use WhatsUp Gold REST API to deploy network and device monitoring and management scripts.*


    !'
servers:
- url: https://10.40.67.158:9644
tags:
- name: DeviceRole
paths:
  /api/v1/device-role/{roleId}:
    get:
      tags:
      - DeviceRole
      summary: Return device role information
      operationId: DeviceRole_GetSummaryTemplateById
      parameters:
      - name: roleId
        in: path
        description: ID of the device role
        required: true
        schema:
          type: string
      - name: view
        in: query
        description: amount of role data to retrieve, default=simple
        required: false
        schema:
          type: string
          enum:
          - id
          - simple
          - basic
          - summary
      - name: Authorization
        in: header
        description: oauth2 access_token
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Result_DeviceRoleSummary'
            text/json:
              schema:
                $ref: '#/components/schemas/Result_DeviceRoleSummary'
      security:
      - oauth2: []
    delete:
      tags:
      - DeviceRole
      summary: Delete a role from the library
      operationId: DeviceRole_RemoveRoleById
      parameters:
      - name: roleId
        in: path
        description: role to be removed
        required: true
        schema:
          type: string
      - name: Authorization
        in: header
        description: oauth2 access_token
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResult'
            text/json:
              schema:
                $ref: '#/components/schemas/SuccessResult'
      security:
      - oauth2: []
  /api/v1/device-role/{roleId}/config/template:
    get:
      tags:
      - DeviceRole
      summary: Return template for a device role
      description: 'Options:

        * all: all information is made available in the template

        * transfer: only data required to transfer or update a role on another system is include in the template

        * copy: only data required to make a copy of the role is added to the role. Will generate a new role on the new system.'
      operationId: DeviceRole_GetTemplateById
      parameters:
      - name: roleId
        in: path
        description: The id of the role
        required: true
        schema:
          type: string
      - name: options
        in: query
        description: type of template to be created, default=transfer
        required: false
        schema:
          type: string
          enum:
          - all
          - clone
          - transfer
          - update
      - name: Authorization
        in: header
        description: oauth2 access_token
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Result_DeviceRoleTemplateReadResults'
            text/json:
              schema:
                $ref: '#/components/schemas/Result_DeviceRoleTemplateReadResults'
      security:
      - oauth2: []
  /api/v1/device-role/{roleId}/enable:
    put:
      tags:
      - DeviceRole
      summary: Enable a device role for use
      operationId: DeviceRole_EnableRoleById
      parameters:
      - name: roleId
        in: path
        description: Role to be enabled
        required: true
        schema:
          type: string
      - name: Authorization
        in: header
        description: oauth2 access_token
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResult'
            text/json:
              schema:
                $ref: '#/components/schemas/SuccessResult'
      security:
      - oauth2: []
  /api/v1/device-role/{roleId}/disable:
    put:
      tags:
      - DeviceRole
      summary: Disable a role from being used
      operationId: DeviceRole_DisableRoleById
      parameters:
      - name: roleId
        in: path
        description: role to be disabled
        required: true
        schema:
          type: string
      - name: Authorization
        in: header
        description: oauth2 access_token
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResult'
            text/json:
              schema:
                $ref: '#/components/schemas/SuccessResult'
      security:
      - oauth2: []
  /api/v1/device-role/{roleId}/restore:
    put:
      tags:
      - DeviceRole
      summary: Restore system role to shipped defaults
      operationId: DeviceRole_RestoreSystemDefaultsById
      parameters:
      - name: roleId
        in: path
        description: role to be restored
        required: true
        schema:
          type: string
      - name: Authorization
        in: header
        description: oauth2 access_token
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResult'
            text/json:
              schema:
                $ref: '#/components/schemas/SuccessResult'
      security:
      - oauth2: []
  /api/v1/device-role/{roleId}/assignments/-:
    get:
      tags:
      - DeviceRole
      summary: Returns role assignments to devices
      operationId: DeviceRole_RoleAssignmentsById
      parameters:
      - name: roleId
        in: path
        description: id of role being requested
        required: true
        schema:
          type: string
      - name: filter
        in: query
        description: optional filter; case-insensitive; filter on role name and alternate names, empty value is ignored
        required: false
        schema:
          type: string
      - name: deviceView
        in: query
        description: type of device information to be returned, default=basic
        required: false
        schema:
          type: string
          enum:
          - id
          - basic
          - card
          - overview
      - name: deviceFilter
        in: query
        description: optional filter; case-insensitive ; searches the device address, display and hostnames, empty value is ignored
        required: false
        schema:
          type: string
      - name: pageId
        in: query
        description: page to start at
        required: false
        schema:
          type: string
      - name: limit
        in: query
        description: the number of assignments per page
        required: false
        schema:
          type: integer
          format: int32
      - name: Authorization
        in: header
        description: oauth2 access_token
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PageResult_List_RoleAssignment'
            text/json:
              schema:
                $ref: '#/components/schemas/PageResult_List_RoleAssignment'
      security:
      - oauth2: []
  /api/v1/device-role/-/assignments/-:
    get:
      tags:
      - DeviceRole
      summary: Returns all role assignments to devices
      operationId: DeviceRole_AllRoleAssignments
      parameters:
      - name: kind
        in: query
        description: type of role to filter on. default=all
        required: false
        schema:
          type: string
          enum:
          - all
          - role
          - brand
          - os
          - subRole
      - name: filter
        in: query
        description: optional filter; case-insensitive ; filter on role id, name or alternate names
        required: false
        schema:
          type: string
      - name: includeUnassignedRoles
        in: query
        description: 'false - (default) only roles that match filters and have assignments will be returned.

          true - all roles that match role filter will be returned.'
        required: false
        schema:
          type: boolean
      - name: deviceView
        in: query
        description: type of device information to be returned, default=basic
        required: false
        schema:
          type: string
          enum:
          - id
          - basic
          - card
          - overview
      - name: deviceFilter
        in: query
        description: optional filter ; case-insensitive ; searches the device address, display and hostnames
        required: false
        schema:
          type: string
      - name: pageId
        in: query
        description: page to start at
        required: false
        schema:
          type: string
      - name: limit
        in: query
        description: the number of assignments per page
        required: false
        schema:
          type: integer
          format: int32
      - name: Authorization
        in: header
        description: oauth2 access_token
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PageResult_List_RoleAssignment'
            text/json:
              schema:
                $ref: '#/components/schemas/PageResult_List_RoleAssignment'
      security:
      - oauth2: []
  /api/v1/device-role/-:
    get:
      tags:
      - DeviceRole
      summary: Return set of device roles
      operationId: DeviceRole_GetSummaryList
      parameters:
      - name: view
        in: query
        description: type of data to return, default=simple
        required: false
        schema:
          type: string
          enum:
          - id
          - simple
          - basic
          - summary
      - name: kind
        in: query
        description: return role of the the specified kind. default=any
        required: false
        schema:
          type: string
          enum:
          - any
          - role
          - brand
          - os
          - subRole
          - monitor
          - interfaceFilter
          - deviceFilter
          - monitorCriteria
      - name: source
        in: query
        description: filter based on the source of the role. default=all
        required: false
        schema:
          type: string
          enum:
          - all
          - system
          - systemModified
          - userDefined
          - allSystem
          - allModified
      - name: name
        in: query
        description: filter based on display name or internal name. Case-insensitive, empty value is ignored
        required: false
        schema:
          type: string
      - name: search
        in: query
        description: filter roles that contain this string in display name, description, id or internal name. Case-insensitive, empty value is ignored
        required: false
        schema:
          type: string
      - name: enabledOnly
        in: query
        description: return only enabled roles, default=false
        required: false
        schema:
          type: boolean
      - name: pageId
        in: query
        description: The pageId, empty will return first page
        required: false
        schema:
          type: string
      - name: limit
        in: query
        description: Limit the number of entries per page, is also limited by service. 0 or empty will give the maximum number per page
        required: false
        schema:
          type: integer
          format: int32
      - name: Authorization
        in: header
        description: oauth2 access_token
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PageResult_List_DeviceRoleSummary'
            text/json:
              schema:
                $ref: '#/components/schemas/PageResult_List_DeviceRoleSummary'
      security:
      - oauth2: []
  /api/v1/device-role/-/config/template:
    get:
      tags:
      - DeviceRole
      summary: Return set of device role templates
      description: 'Options:

        * all: all information is made available in the template

        * transfer: only data required to transfer or update a role on another system is include in the template

        * copy: only data required to make a copy of the role is added to the role. Will generate a new role on the new system.'
      operationId: DeviceRole_GetTemplate
      parameters:
      - name: options
        in: query
        description: empty is the default options. Multiple options may be passed separated by commas, default=transfer
        required: false
        schema:
          type: string
          enum:
          - all
          - clone
          - transfer
          - update
      - name: kind
        in: query
        description: return role of the the specified kind. default=any
        required: false
        schema:
          type: string
          enum:
          - any
          - role
          - brand
          - os
          - subRole
          - monitor
          - interfaceFilter
          - deviceFilter
          - monitorCriteria
      - name: source
        in: query
        description: filter based on the source of the role. default=all
        required: false
        schema:
          type: string
          enum:
          - all
          - system
          - systemModified
          - userDefined
          - allSystem
          - allModified
      - name: name
        in: query
        description: filter based on display name or internal name. Case-insensitive, empty value is ignored
        required: false
        schema:
          type: string
      - name: search
        in: query
        description: filter roles that contain this string in display name, description, id or internal name. Case-insensitive, empty value is ignored
        required: false
        schema:
          type: string
      - name: enabledOnly
        in: query
        description: return only enabled roles, default=false
        required: false
        schema:
          type: boolean
      - name: pageId
        in: query
        description: The pageId, empty will return first page
        required: false
        schema:
          type: string
      - name: limit
        in: query
        description: Limit the number of entries per page, is also limited by service. 0 or empty will give the maximum number per page
        required: false
        schema:
          type: integer
          format: int32
      - name: Authorization
        in: header
        description: oauth2 access_token
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PageResult_DeviceRoleTemplateReadResults'
            text/json:
              schema:
                $ref: '#/components/schemas/PageResult_DeviceRoleTemplateReadResults'
      security:
      - oauth2: []
    patch:
      tags:
      - DeviceRole
      summary: Apply multiple device role templates
      operationId: DeviceRole_ApplyTemplates
      parameters:
      - name: Authorization
        in: header
        description: oauth2 access_token
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Result_ApplyTemplateResults'
            text/json:
              schema:
                $ref: '#/components/schemas/Result_ApplyTemplateResults'
      security:
      - oauth2: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeviceRoleTemplateBatch'
          text/json:
            schema:
              $ref: '#/components/schemas/DeviceRoleTemplateBatch'
        description: set of role templates to apply
        required: true
  /api/v1/device-role/-/config/export/content:
    post:
      tags:
      - DeviceRole
      summary: Inventory of a package based on options
      operationId: DeviceRole_PackageExportContent
      parameters:
      - name: Authorization
        in: header
        description: oauth2 access_token
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PackageContentResult'
            text/json:
              schema:
                $ref: '#/components/schemas/PackageContentResult'
      security:
      - oauth2: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PackageRequest'
          text/json:
            schema:
              $ref: '#/components/schemas/PackageRequest'
        required: true
  /api/v1/device-role/-/config/export:
    post:
      tags:
      - DeviceRole
      summary: Generate a package for delivery to another WhatsUp Gold System
      operationId: DeviceRole_PackageExport
      parameters:
      - name: Authorization
        in: header
        description: oauth2 access_token
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PackageSignedResult'
            text/json:
              schema:
                $ref: '#/components/schemas/PackageSignedResult'
      security:
      - oauth2: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PackageRequest'
          text/json:
            schema:
              $ref: '#/components/schemas/PackageRequest'
        required: true
  /api/v1/device-role/-/config/import/verify:
    post:
      tags:
      - DeviceRole
      summary: Inventory/Verify the contents of the a package
      operationId: DeviceRole_VerifyPackage
      parameters:
      - name: Authorization
        in: header
        description: oauth2 access_token
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PackageContentOpResult'
            text/json:
              schema:
                $ref: '#/components/schemas/PackageContentOpResult'
      security:
      - oauth2: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PackageApply'
          text/json:
            schema:
              $ref: '#/components/schemas/PackageApply'
        description: the signed package to be examined
        required: true
  /api/v1/device-role/-/config/import:
    post:
      tags:
      - DeviceRole
      summary: Apply a package
      operationId: DeviceRole_ApplyPackage
      parameters:
      - name: Authorization
        in: header
        description: oauth2 access_token
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PackageContentOpResult'
            text/json:
              schema:
                $ref: '#/components/schemas/PackageContentOpResult'
      security:
      - oauth2: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PackageApply'
          text/json:
            schema:
              $ref: '#/components/schemas/PackageApply'
        description: options and signed package to be applied
        required: true
  /api/v1/device-role/-/percentVariables:
    get:
      tags:
      - DeviceRole
      summary: Return a list of percent variables by type
      operationId: DeviceRole_GetPercentVariables
      parameters:
      - name: choice
        in: query
        description: Type of variables requested, default=discoveryDevice
        required: false
        schema:
          type: string
          enum:
          - discoveryDevice
          - discoverySession
          - monitoredDevice
          - discoveredNetwork
          - device
      - name: Authorization
        in: header
        description: oauth2 access_token
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Result_List_String'
            text/json:
              schema:
                $ref: '#/components/schemas/Result_List_String'
      security:
      - oauth2: []
components:
  schemas:
    PackageRoleId:
      description: provide a list of starting roles to be included in package.
      type: object
      properties:
        name:
          description: "name of role, \n\tloses to id\n\tincludes as starting roles, all roles with same name unless kind is provided"
          type: string
        kind:
          description: filter starting roles to a particular kind of role.
          type: string
        id:
          description: explicit role identifier as a starting role (preferred)
          type: string
    TemplateMap:
      description: provides a mapping from a template id to the resulting generated id.
      type: object
      properties:
        templateId:
          description: Caller provided template Id
          type: string
        resultId:
          description: Id generated when template was applied.
          type: string
    PackageSignedResult:
      description: a signed package result
      type: object
      properties:
        pkg:
          $ref: '#/components/schemas/SignedPackage'
          description: the signed package
        result:
          $ref: '#/components/schemas/PackageResult'
          description: the result package
        diag:
          $ref: '#/components/schemas/PackageDiagnostics'
    PackageKeyOp:
      description: Operation on the key
      type: object
      properties:
        op:
          description: operation being preformed
          enum:
          - unknown
          - noop
          - add
          - modify
          type: string
        complete:
          description: set true if operation was successfully completed
          type: boolean
        signer:
          $ref: '#/components/schemas/PackageSignerId'
          description: signer of the key
    PackageRoleOp:
      description: Package Role Operation
      type: object
      properties:
        op:
          description: operation being preformed
          enum:
          - unknown
          - noop
          - add
          - modify
          type: string
          readOnly: true
        complete:
          description: set true if operation was applied, if op is noop, value will always be false
          type: boolean
          readOnly: true
        system_op:
          description: Operation on role for system settings
          enum:
          - unknown
          - noop
          - add
          - modify
          type: string
        system_complete:
          description: set true if operation was applied, if op is noop, value will always be false
          type: boolean
        system_signer:
          $ref: '#/components/schemas/PackageSignerId'
          description: system signer of role
        vendor_op:
          description: Operation on role for user/vendor adjustable settings
          enum:
          - unknown
          - noop
          - add
          - modify
          type: string
        vendor_complete:
          description: set true if operation was applied, if op is noop, value will always be false
          type: boolean
        vendor_signer:
          $ref: '#/components/schemas/PackageSignerId'
          description: vendor signer of role
        internal_name:
          description: internal name for role
          type: string
        description:
          description: description of role
          type: string
        name:
          description: "name of role, \n\tloses to id\n\tincludes as starting roles, all roles with same name unless kind is provided"
          type: string
        kind:
          description: filter starting roles to a particular kind of role.
          type: string
        id:
          description: explicit role identifier as a starting role (preferred)
          type: string
    PackageRole:
      description: device role
      type: object
      properties:
        systemId:
          description: system role identifier, may be empty
          type: string
        id:
          description: unique identifier
          type: string
        refId:
          description: package identifier
          type: string
        name:
          description: name of the role
          type: string
        kind:
          description: type of role
          type: string
        isNetworkDevice:
          description: if device has this role, then consider it a network device
          type: boolean
        isEnabled:
          description: role is enabled, default is true
          type: boolean
        elements:
          description: list of associated data
          type: array
          items:
            $ref: '#/components/schemas/PackageRoleRule'
    DeviceOsDetailFinder:
      description: OS Detail Finder
      type: object
      properties:
        type:
          description: type of routine for finding os details
          type: string
        groups:
          description: criteria group for retrieving os version
          type: array
          items:
            $ref: '#/components/schemas/CriteriaGroup'
    PackageHeader:
      description: Provide general information about the package and processing
      type: object
      properties:
        name:
          description: name of the package provided by creator. (REQUIRED)
          type: string
        description:
          description: description for the package provided by creator (Optional)
          type: string
        author:
          description: provider of this package (Optional)
          type: string
        creation_time:
          format: date-time
          description: time this package was created (utc)
          type: string
        format_version:
          description: package format version (Optional)
          type: string
        okey_required:
          description: true if an obfuscation key was used to create this package. If not present, default value is false
          type: boolean
        scripting_required:
          description: scripting monitor was detected
          type: boolean
        has_sensitive_data:
          description: a monitor or others has sensitive data
          type: boolean
        sensitive_data_removed:
          description: a monitor or others sensitive data was dropped
          type: boolean
    DeviceRoleApmMatch:
      description: Apm Match rules
      type: object
      properties:
        applyDiscovered:
          description: Apply no tasks.
          type: boolean
        onComplete:
          description: What to do after this action is complete
          enum:
          - next
          - stop
          type: string
    PackageSignerId:
      description: Set of information required for a key request
      type: object
      properties:
        name:
          description: The "name" for the key. For use with acceptance dialog shown to the end user. (optional)
          type: string
        kid:
          description: 'The "kid" (key ID) Header Parameter is a hint indicating which key was used to secure the JWS.This parameter allows originators to explicitly signal a change of key to recipients.The structure of the "kid" value is unspecified.Its value MUST be a case-sensitive string. Use of this Header Parameter is REQUIRED.

            Current suggested implementation is limited to 150 characters. (required)'
          type: string
        alg:
          description: The "alg" (algorithm) identifies the cryptographic algorithm used. (required)
          type: string
        kver:
          description: The "kver" (key version) parameter contains the current version of the key. If empty, version will be "0.0.0". (Optional)
          type: string
        issue_time:
          format: date-time
          description: date at which this key will or became active
          type: string
    ScanCriteriaGroup:
      description: ScanCriteriaGroup
      type: object
      properties:
        upgradeGuid:
          description: Element GUID
          type: string
        scanCriteria:
          description: The scanning criteria that define this template.
          type: array
          items:
            $ref: '#/components/schemas/ScanCriteria'
        relationBetweenCriteria:
          description: "Indicates if a template is a match if any of its multiple criteria is a match (OR), \nor if all of its criteria are matches (AND)."
          enum:
