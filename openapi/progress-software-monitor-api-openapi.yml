openapi: 3.2.0
info:
  version: v1
  title: WhatsUp Gold Monitor API
  x-logo:
    url: images/wug_logo.svg
  description: '**Version 2026.0**


    *Use WhatsUp Gold REST API to deploy network and device monitoring and management scripts.*


    !'
servers:
- url: https://10.40.67.158:9644
tags:
- name: Monitor
paths:
  /api/v1/monitors/{monitorId}/assignments/-:
    get:
      tags:
      - Monitor
      summary: Get monitor assignments for a single monitor
      operationId: Monitor_MonitorAssignmentsById
      parameters:
      - name: monitorId
        in: path
        description: monitor id to be returned
        required: true
        schema:
          type: string
      - name: type
        in: query
        description: type of monitor assignment, default=active
        required: false
        schema:
          type: string
          enum:
          - active
          - performance
          - passive
      - name: view
        in: query
        description: information level return for each assignment. Default=basic
        required: false
        schema:
          type: string
          enum:
          - id
          - minimum
          - basic
          - status
      - name: deviceView
        in: query
        description: information level returned for each device with an assignment. default=id
        required: false
        schema:
          type: string
          enum:
          - id
          - basic
          - card
          - overview
      - name: pageId
        in: query
        description: page to return, empty will provide 1st page of data. default=empty
        required: false
        schema:
          type: string
      - name: limit
        in: query
        description: number of items per page
        required: false
        schema:
          type: integer
          format: int32
      - name: Authorization
        in: header
        description: oauth2 access_token
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PageResult_List_AssignedMonitorWithDevice'
            text/json:
              schema:
                $ref: '#/components/schemas/PageResult_List_AssignedMonitorWithDevice'
      security:
      - oauth2: []
    delete:
      tags:
      - Monitor
      summary: Delete assignments for a monitor
      description: 'Note: This call will only delete assignment to devices the caller has rights to modify'
      operationId: Monitor_DeleteMonitorAssignmentsById
      parameters:
      - name: monitorId
        in: path
        description: monitor id to remove assignments for
        required: true
        schema:
          type: string
      - name: type
        in: query
        description: type of monitor assignment
        required: true
        schema:
          type: string
          enum:
          - active
          - performance
          - passive
      - name: Authorization
        in: header
        description: oauth2 access_token
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Result_ApplyTemplateResults'
            text/json:
              schema:
                $ref: '#/components/schemas/Result_ApplyTemplateResults'
      security:
      - oauth2: []
  /api/v1/monitors/-/assignments/-:
    get:
      tags:
      - Monitor
      summary: Get active monitor assignments for a single monitor
      operationId: Monitor_MonitorAssignments
      parameters:
      - name: type
        in: query
        description: type of monitor assignment, default=all
        required: false
        schema:
          type: string
          enum:
          - all
          - active
          - performance
          - passive
      - name: view
        in: query
        description: information level return for each assignment. Default=basic
        required: false
        schema:
          type: string
          enum:
          - id
          - minimum
          - basic
          - status
      - name: deviceView
        in: query
        description: information level returned for each device with an assignment. default=id
        required: false
        schema:
          type: string
          enum:
          - id
          - basic
          - card
          - overview
      - name: search
        in: query
        description: return only assignments that contain this string in monitor type name, description or class id. Case-insensitive, empty value is ignored
        required: false
        schema:
          type: string
      - name: pageId
        in: query
        description: page to return, empty will provide 1st page of data. default=empty
        required: false
        schema:
          type: string
      - name: limit
        in: query
        description: number of items per page
        required: false
        schema:
          type: integer
          format: int32
      - name: Authorization
        in: header
        description: oauth2 access_token
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PageResult_List_AssignedMonitorWithDevice'
            text/json:
              schema:
                $ref: '#/components/schemas/PageResult_List_AssignedMonitorWithDevice'
      security:
      - oauth2: []
    delete:
      tags:
      - Monitor
      summary: Delete assignments for a monitor
      description: 'Note: This call will only delete assignment for devices the caller has rights to modify only'
      operationId: Monitor_DeleteMonitorAssignmentsByQuery
      parameters:
      - name: type
        in: query
        description: type of monitor assignment to delete, default=all
        required: false
        schema:
          type: string
          enum:
          - all
          - active
          - performance
          - passive
      - name: includeDeviceMonitors
        in: query
        description: match device specific monitor assignments, default=false
        required: false
        schema:
          type: boolean
      - name: includeSystemMonitors
        in: query
        description: match assignments to monitors that are consider system, default=false
        required: false
        schema:
          type: boolean
      - name: includeCoreMonitors
        in: query
        description: match assignments to monitors that are consider core, default=false
        required: false
        schema:
          type: boolean
      - name: search
        in: query
        description: remove only assignments to monitors that contain this string in monitor type name, description or class id. Case-insensitive, empty value is ignored
        required: false
        schema:
          type: string
      - name: Authorization
        in: header
        description: oauth2 access_token
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Result_ApplyTemplateResults'
            text/json:
              schema:
                $ref: '#/components/schemas/Result_ApplyTemplateResults'
      security:
      - oauth2: []
  /api/v1/monitors/{monitorId}:
    get:
      tags:
      - Monitor
      summary: Return single monitor
      operationId: Monitor_GetById
      parameters:
      - name: monitorId
        in: path
        description: ID of the monitor
        required: true
        schema:
          type: string
      - name: type
        in: query
        description: type of monitor to return, default=active
        required: false
        schema:
          type: string
          enum:
          - active
          - performance
          - passive
      - name: view
        in: query
        description: level of information returned, default=info
        required: false
        schema:
          type: string
          enum:
          - id
          - basic
          - info
          - summary
          - details
      - name: Authorization
        in: header
        description: oauth2 access_token
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Result_MonitorTemplateReadResults'
            text/json:
              schema:
                $ref: '#/components/schemas/Result_MonitorTemplateReadResults'
      security:
      - oauth2: []
    put:
      tags:
      - Monitor
      summary: Update a monitor's configuration
      description: 'This update method expects the calling application to include a populated properties array (configuration) for the monitor.

        * If you pass this method an empty property value, this input can clear a previously set configuration value.

        * Empty configuration properties can revert to default configuration values for properties with defined default values.

        * If you pass this method an empty array, this reverts the monitor to its simplest default configuration.

        \n\n**Tip:** When you want to update a monitor configuration, use the monitor ID to get a populated (or default) configuration

        properties array. Then re-use it. Adjust property values as needed and include this configuration properties array with the request body.'
      operationId: Monitor_UpdateMonitorById
      parameters:
      - name: monitorId
        in: path
        description: ID of the monitor
        required: true
        schema:
          type: string
      - name: type
        in: query
        description: type of monitor to update
        required: true
        schema:
          type: string
          enum:
          - active
          - performance
          - passive
      - name: Authorization
        in: header
        description: oauth2 access_token
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Result_ApplyTemplateResults'
            text/json:
              schema:
                $ref: '#/components/schemas/Result_ApplyTemplateResults'
      security:
      - oauth2: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MonitorUpdate'
          text/json:
            schema:
              $ref: '#/components/schemas/MonitorUpdate'
        description: the changes to be made to the monitor
        required: true
    delete:
      tags:
      - Monitor
      summary: Delete a monitor
      description: 'Note: The user may have right to remove a monitor but not see or delete all assignment.'
      operationId: Monitor_DeleteMonitorById
      parameters:
      - name: monitorId
        in: path
        description: monitor to be removed
        required: true
        schema:
          type: string
      - name: type
        in: query
        description: type of monitor
        required: true
        schema:
          type: string
          enum:
          - active
          - performance
          - passive
      - name: failIfInUse
        in: query
        description: do not delete monitor if in use. Default=true
        required: false
        schema:
          type: boolean
      - name: Authorization
        in: header
        description: oauth2 access_token
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Result_ApplyTemplateResults'
            text/json:
              schema:
                $ref: '#/components/schemas/Result_ApplyTemplateResults'
      security:
      - oauth2: []
  /api/v1/monitors/-:
    get:
      tags:
      - Monitor
      summary: Return set of monitors
      operationId: Monitor_GetAll
      parameters:
      - name: type
        in: query
        description: filter for type of monitors. default=all
        required: false
        schema:
          type: string
          enum:
          - all
          - active
          - performance
          - passive
      - name: view
        in: query
        description: level of information returned, default=info
        required: false
        schema:
          type: string
          enum:
          - id
          - basic
          - info
          - summary
          - details
      - name: includeDeviceMonitors
        in: query
        description: return device specific monitors, default=false
        required: false
        schema:
          type: boolean
      - name: includeSystemMonitors
        in: query
        description: return monitors owned by the system and cannot be modified. default=false
        required: false
        schema:
          type: boolean
      - name: includeCoreMonitors
        in: query
        description: '"return monitors that are considers core, default=false"'
        required: false
        schema:
          type: boolean
      - name: search
        in: query
        description: return only monitors that contain this string in display name, description or classId. Case-insensitive, empty value is ignored
        required: false
        schema:
          type: string
      - name: allMonitors
        in: query
        description: 'Deprecated: include both device and system monitors, etc. default=false'
        required: false
        schema:
          type: boolean
      - name: pageId
        in: query
        description: page to return
        required: false
        schema:
          type: string
      - name: limit
        in: query
        description: maximum number of items per page
        required: false
        schema:
          type: integer
          format: int32
      - name: Authorization
        in: header
        description: oauth2 access_token
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PageResult_MonitorTemplateReadResults'
            text/json:
              schema:
                $ref: '#/components/schemas/PageResult_MonitorTemplateReadResults'
      security:
      - oauth2: []
    post:
      tags:
      - Monitor
      summary: Add to the monitor library
      operationId: Monitor_CreateMonitor
      parameters:
      - name: Authorization
        in: header
        description: oauth2 access_token
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Result_ApplyTemplateResults'
            text/json:
              schema:
                $ref: '#/components/schemas/Result_ApplyTemplateResults'
      security:
      - oauth2: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MonitorAdd'
          text/json:
            schema:
              $ref: '#/components/schemas/MonitorAdd'
        description: add operation for a monitor
        required: true
    delete:
      tags:
      - Monitor
      summary: Delete a set of monitors
      description: 'Note: The user may have right to remove a monitor but not see or delete all assignment.'
      operationId: Monitor_DeleteMonitors
      parameters:
      - name: type
        in: query
        description: type of monitor being deleted
        required: false
        schema:
          type: string
          enum:
          - all
          - active
          - performance
          - passive
      - name: includeDeviceMonitors
        in: query
        description: delete device specific monitors, default=false
        required: false
        schema:
          type: boolean
      - name: includeSystemMonitors
        in: query
        description: delete monitors owned by the system and cannot be modified. default=false
        required: false
        schema:
          type: boolean
      - name: search
        in: query
        description: delete only monitors that contain this string in display name, description or classId. Case-insensitive, empty value is ignored
        required: false
        schema:
          type: string
      - name: failIfInUse
        in: query
        description: do not delete monitor if in use. Default=true
        required: false
        schema:
          type: boolean
      - name: Authorization
        in: header
        description: oauth2 access_token
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Result_ApplyTemplateResults'
            text/json:
              schema:
                $ref: '#/components/schemas/Result_ApplyTemplateResults'
      security:
      - oauth2: []
    patch:
      tags:
      - Monitor
      summary: Do multiple operations against the monitor library
      operationId: Monitor_PatchMonitors
      parameters:
      - name: Authorization
        in: header
        description: oauth2 access_token
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Result_ApplyTemplateResults'
            text/json:
              schema:
                $ref: '#/components/schemas/Result_ApplyTemplateResults'
      security:
      - oauth2: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MonitorBatch'
          text/json:
            schema:
              $ref: '#/components/schemas/MonitorBatch'
        description: set of operations to preform
        required: true
  /api/v1/monitors/-/config/supported-types:
    get:
      tags:
      - Monitor
      summary: Return set of supported monitor types
      operationId: Monitor_GetRegisteredTypes
      parameters:
      - name: type
        in: query
        description: filter by base monitor type. default=all
        required: false
        schema:
          type: string
          enum:
          - all
          - active
          - performance
          - passive
      - name: includeCoreMonitorTypes
        in: query
        description: return supported monitor types considered core. default=false
        required: false
        schema:
          type: boolean
      - name: Authorization
        in: header
        description: oauth2 access_token
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Result_List_MonitorSupportedType'
            text/json:
              schema:
                $ref: '#/components/schemas/Result_List_MonitorSupportedType'
      security:
      - oauth2: []
  /api/v1/monitors/{monitorId}/config/template:
    get:
      tags:
      - Monitor
      summary: Return template for a monitor
      operationId: Monitor_GetTemplateById
      parameters:
      - name: monitorId
        in: path
        description: The id of the monitor
        required: true
        schema:
          type: string
      - name: key
        in: query
        description: empty then sensitive data will be clear text. if an obfuscation key is provided, the same key will be required restore the sensitive data
        required: false
        schema:
          type: string
      - name: dropSensitiveData
        in: query
        description: replace sensitive data with an empty value
        required: false
        schema:
          type: boolean
      - name: type
        in: query
        description: type of monitor to return, default=active
        required: false
        schema:
          type: string
          enum:
          - active
          - performance
          - passive
      - name: Authorization
        in: header
        description: oauth2 access_token
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Result_MonitorTemplateReadResults'
            text/json:
              schema:
                $ref: '#/components/schemas/Result_MonitorTemplateReadResults'
      security:
      - oauth2: []
  /api/v1/monitors/-/config/template:
    get:
      tags:
      - Monitor
      summary: Return set of monitor templates
      operationId: Monitor_GetTemplates
      parameters:
      - name: key
        in: query
        description: empty then sensitive data will be clear text. When an obfuscation key is provided, the same key is required to restore the sensitive data
        required: false
        schema:
          type: string
      - name: replaceSensitiveData
        in: query
        description: replace sensitive data with empty value
        required: false
        schema:
          type: boolean
      - name: type
        in: query
        description: filter for type of monitors. default=all
        required: false
        schema:
          type: string
          enum:
          - all
          - active
          - performance
          - passive
      - name: includeDeviceMonitors
        in: query
        description: return device specific monitors, default=false
        required: false
        schema:
          type: boolean
      - name: includeSystemMonitors
        in: query
        description: return monitors owned by the system and cannot be modified. default=false
        required: false
        schema:
          type: boolean
      - name: search
        in: query
        description: return only monitors that contain this string in display name, description or classId. Case-insensitive, empty value is ignored
        required: false
        schema:
          type: string
      - name: allMonitors
        in: query
        description: 'Deprecated: include both device and system monitors, etc. default=false'
        required: false
        schema:
          type: boolean
      - name: pageId
        in: query
        description: page to return
        required: false
        schema:
          type: string
      - name: limit
        in: query
        description: maximum number of items per page
        required: false
        schema:
          type: integer
          format: int32
      - name: Authorization
        in: header
        description: oauth2 access_token
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PageResult_MonitorTemplateReadResults'
            text/json:
              schema:
                $ref: '#/components/schemas/PageResult_MonitorTemplateReadResults'
      security:
      - oauth2: []
    patch:
      tags:
      - Monitor
      summary: Apply multiple monitor templates
      operationId: Monitor_ApplyMonitorTemplates
      parameters:
      - name: key
        in: query
        description: value used to unwrap sensitive data
        required: false
        schema:
          type: string
      - name: Authorization
        in: header
        description: oauth2 access_token
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Result_ApplyTemplateResults'
            text/json:
              schema:
                $ref: '#/components/schemas/Result_ApplyTemplateResults'
      security:
      - oauth2: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApplyMonitorTemplates'
          text/json:
            schema:
              $ref: '#/components/schemas/ApplyMonitorTemplates'
        description: set of monitor templates to apply
        required: true
components:
  schemas:
    ActiveMonitorItems:
      description: Additional information for assigning active monitors
      type: object
      properties:
        comment:
          description: 'Comment specified when the monitor was assigned to the device

            Typically used for interface active monitor assignment where comment is the interface description'
          type: string
        argument:
          description: Gets or sets the argument.
          type: string
        interfaceId:
          description: Gets or sets the network interface id
          type: string
        pollingIntervalSeconds:
          format: int32
          description: 'Gets or sets the polling interval for the monitor

            Valid values are between 10 and 86400 seconds inclusive'
          type: integer
        criticalOrder:
          format: int32
          description: Gets or sets the critical order for the active monitor
          type: integer
        actionPolicyId:
          description: Gets or sets the action policy id
          type: string
        actionPolicyName:
          description: Gets or sets the action policy Name
          type: string
    DeviceOverview:
      description: "Provides an overview of a given device in terms \nof basic summary information as well as monitoring \nstatus."
      type: object
      properties:
        downActiveMonitors:
          description: A collection of Down Active monitor status items
          type: array
          items:
            $ref: '#/components/schemas/MonitorAssignmentStatus'
        totalActiveMonitors:
          format: int32
          description: The total number of active monitors for this device
          type: integer
        totalActiveMonitorsDown:
          format: int32
          description: The total number of active monitors that are down for this device
          type: integer
        notes:
          description: The notes field for the device
          type: string
        hostName:
          description: The hostname for the device
          type: string
        networkAddress:
          description: The current network address of the device. Usually an IP address.
          type: string
        role:
          description: The primary role of the device (e.g. router, switch, etc.).
          type: string
        brand:
          description: The brand for the device (e.g. Cisco)
          type: string
        os:
          description: The operating system for the device (e.g. windows, linux, etc)
          type: string
        bestState:
          description: The best state of the device, like Up
          enum:
          - Unknown
          - Up
          - Down
          - Maintenance
          - Any
          type: string
        worstState:
          description: The worst state of the device, like Down
          enum:
          - Unknown
          - Up
          - Down
          - Maintenance
          - Any
          type: string
        name:
          type: string
        description:
          type: string
        id:
          type: string
    TemplateMap:
      description: provides a mapping from a template id to the resulting generated id.
      type: object
      properties:
        templateId:
          description: Caller provided template Id
          type: string
        resultId:
          description: Id generated when template was applied.
          type: string
    MonitorUpdate:
      description: Update object for Monitors
      type: object
      properties:
        name:
          description: monitor description
          type: string
        description:
          description: monitor description
          type: string
        propertyBags:
          description: Configuration Data Field
          type: array
          items:
            $ref: '#/components/schemas/MonitorPropertyBagAdd'
        useInDiscovery:
          description: 'Update the "useInDiscovery" value on monitor.

            If null, no update will be attempted'
          type: boolean
    PerformanceMonitorTemplate:
      description: Template representing a Performance monitor.
      type: object
      properties:
        ownedByDevice:
          $ref: '#/components/schemas/DeviceTemplateReferenceName'
          description: Device Assignment Field
        hasSensitiveData:
          description: 'True if the monitor is a script based monitor and the user

            does not have rights to see the property bags.'
          type: boolean
        templateId:
          description: Unique identifier for this template
          type: string
        monitorTypeInfo:
          $ref: '#/components/schemas/MonitorTypeInfo'
          description: Gets or sets the monitor type information.
        monitorId:
          description: Monitor Id Field obsoleted 20.0
          type: string
        propertyBags:
          description: Configuration Data Field
          type: array
          items:
            $ref: '#/components/schemas/MonitorPropertyBag'
        name:
          type: string
        description:
          type: string
        id:
          type: string
    MonitorAdd:
      description: Update object for Monitors
      type: object
      properties:
        allowSystemMonitorCreation:
          description: 'set true if using the add operation to create a system monitor.

            each system monitor has its own creation rules. Default is false.'
          type: boolean
        name:
          description: Name of monitor
          type: string
        description:
          description: Description of monitor
          type: string
        monitorTypeInfo:
          $ref: '#/components/schemas/MonitorTypeInfoAdd'
          description: Type of monitor to create and type
        propertyBags:
          description: Configuration Data Field
          type: array
          items:
            $ref: '#/components/schemas/MonitorPropertyBagAdd'
        useInDiscovery:
          description: 'Update the "useInDiscovery" value on monitor.

            If null, no update will be attempted'
          type: boolean
