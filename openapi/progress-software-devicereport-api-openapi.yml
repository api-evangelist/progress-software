  /api/v1/devices/{deviceId}/reports/state-change:
    get:
      tags:
      - DeviceReport
      summary: Device state change timeline report
      description: 'Date range filter choices ( range ):

        **Note:**

        Unless otherwise specified all filters are relative to the wug service time zone.


        * today - returned data generated today

        * lastPolled - return data gathered on last poll

        * yesterday - data gathered yesterday

        * lastMonth - data gathered from previous month

        * lastQuarter - data gathered from last quarter

        * weekToDate - data gathered since the beginning of this week.

        * monthToDate - data gathered since the beginning of the month

        * quarterToDate - data gathered since the beginning of the quarter


        The following choices for the Date range filter use the value of "rangeN" to indicate the number to increment the data filter by.

        * lastNSeconds - data gathered in the last N seconds

        * lastNMinutes - data gathered in the last N minutes

        * lastNHours - data gathered in the last N hours

        * lastNDays - data gathered in the last N days

        * lastNWeeks - data gathered in the last N weeks

        * lastNMonths - data gathered in the last N months


        The following choices for the Date range filter uses the values of "rangeStartUtc" and "rangeEndUtc" to indicate the data to consider for the report.

        * custom - data is gathered between ''rangeStartUtc'' and ''rangeEndUtc'' date.'
      operationId: DeviceReport_DeviceStateChangeReport
      parameters:
      - name: deviceId
        in: path
        description: The ID of the device
        required: true
        schema:
          type: string
      - name: range
        in: query
        description: Date range for report. default=today. Works in conjunction with start, end and offset values
        required: false
        schema:
          type: string
          enum:
          - today
          - lastPolled
          - yesterday
          - lastWeek
          - lastMonth
          - lastQuarter
          - weekToDate
          - monthToDate
          - quarterToDate
          - lastNSeconds
          - lastNMinutes
          - lastNHours
          - lastNDays
          - lastNWeeks
          - lastNMonths
          - custom
      - name: rangeStartUtc
        in: query
        description: Time to start the report at when custom date range is selected
        required: false
        schema:
          type: string
          format: date-time
      - name: rangeEndUtc
        in: query
        description: Time to end the report when custom date range is selected
        required: false
        schema:
          type: string
          format: date-time
      - name: rangeN
        in: query
        description: Number to calculate when LastNSeconds, LastNMinutes, etc is selected
        required: false
        schema:
          type: integer
          format: int32
      - name: sortBy
        in: query
        description: column name to sort report by. default="startTimeUtc"
        required: false
        schema:
          type: string
          enum:
          - defaultColumn
          - deviceName
          - monitorTypeName
          - stateName
          - startTimeUtc
          - endTimeUtc
          - totalSeconds
          - result
      - name: sortByDir
        in: query
        description: direction to sort report. default=ascending
        required: false
        schema:
          type: string
          enum:
          - asc
          - desc
      - name: groupBy
        in: query
        description: Column name to group the report by, default=no grouping
        required: false
        schema:
          type: string
          enum:
          - noGrouping
          - deviceName
          - monitorTypeName
          - stateName
          - startTimeUtc
          - endTimeUtc
          - totalSeconds
          - result
      - name: groupByDir
        in: query
        description: direction to group report by, default=ascending
        required: false
        schema:
          type: string
          enum:
          - asc
          - desc
      - name: pageId
        in: query
        description: the pageId, empty will return first page
        required: false
        schema:
          type: string
      - name: limit
        in: query
        description: limit the number of entries per page, is also limited by service. 0 or empty will give the maximum number per page
        required: false
        schema:
          type: integer
          format: int32
      - name: Authorization
        in: header
        description: oauth2 access_token
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PageResult_List_StateChangeTimeline'
            text/json:
              schema:
                $ref: '#/components/schemas/PageResult_List_StateChangeTimeline'
      security:
      - oauth2: []
