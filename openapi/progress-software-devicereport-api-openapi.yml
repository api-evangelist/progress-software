openapi: 3.2.0
info:
  version: v1
  title: WhatsUp Gold Device Report API
  x-logo:
    url: images/wug_logo.svg
  description: '**Version 2026.0**


    *Use WhatsUp Gold REST API to deploy network and device monitoring and management scripts.*


    !'
servers:
- url: https://10.40.67.158:9644
tags:
- name: DeviceReport
paths:
  /api/v1/devices/{deviceId}/reports/cpu-utilization:
    get:
      tags:
      - DeviceReport
      summary: Return CPU utilization report for a device
      description: 'Date range filter choices ( range ):

        **Note:**

        Unless otherwise specified all filters are relative to the wug service time zone.


        * today - returned data generated today

        * lastPolled - return data gathered on last poll

        * yesterday - data gathered yesterday

        * lastMonth - data gathered from previous month

        * lastQuarter - data gathered from last quarter

        * weekToDate - data gathered since the beginning of this week.

        * monthToDate - data gathered since the beginning of the month

        * quarterToDate - data gathered since the beginning of the quarter


        The following choices for the Date range filter use the value of "rangeN" to indicate the number to increment the data filter by.

        * lastNSeconds - data gathered in the last N seconds

        * lastNMinutes - data gathered in the last N minutes

        * lastNHours - data gathered in the last N hours

        * lastNDays - data gathered in the last N days

        * lastNWeeks - data gathered in the last N weeks

        * lastNMonths - data gathered in the last N months


        The following choices for the Date range filter uses the values of "rangeStartUtc" and "rangeEndUtc" to indicate the data to consider for the report.

        * custom - data is gathered between ''rangeStartUtc'' and ''rangeEndUtc'' date.'
      operationId: DeviceReport_DeviceCpuUtilizationReport
      parameters:
      - name: deviceId
        in: path
        description: The ID of the device
        required: true
        schema:
          type: string
      - name: range
        in: query
        description: date range to filter the data by. default=today
        required: false
        schema:
          type: string
          enum:
          - today
          - lastPolled
          - yesterday
          - lastWeek
          - lastMonth
          - lastQuarter
          - weekToDate
          - monthToDate
          - quarterToDate
          - lastNSeconds
          - lastNMinutes
          - lastNHours
          - lastNDays
          - lastNWeeks
          - lastNMonths
          - custom
      - name: rangeStartUtc
        in: query
        description: Used when 'range' is set to custom values. The start date for the report
        required: false
        schema:
          type: string
          format: date-time
      - name: rangeEndUtc
        in: query
        description: Used when 'range' is set to custom value. The end data for the report
        required: false
        schema:
          type: string
          format: date-time
      - name: rangeN
        in: query
        description: used with the range field as a multiplier, default=1
        required: false
        schema:
          type: integer
          format: int32
      - name: sortBy
        in: query
        description: column name to sort report by. default="avgPercent"
        required: false
        schema:
          type: string
          enum:
          - defaultColumn
          - id
          - deviceName
          - cpu
          - cpuId
          - pollTimeUtc
          - timeFromLastPollSeconds
          - minPercent
          - maxPercent
          - avgPercent
      - name: sortByDir
        in: query
        description: direction to sort report. default=descending
        required: false
        schema:
          type: string
          enum:
          - asc
          - desc
      - name: groupBy
        in: query
        description: Column name to group the report by, default=no grouping
        required: false
        schema:
          type: string
          enum:
          - noGrouping
          - id
          - deviceName
          - cpu
          - cpuId
          - pollTimeUtc
          - timeFromLastPollSeconds
          - minPercent
          - maxPercent
          - avgPercent
      - name: groupByDir
        in: query
        description: direction to group report by, default=ascending
        required: false
        schema:
          type: string
          enum:
          - asc
          - desc
      - name: applyThreshold
        in: query
        description: indicates whether the threshold filter is applied. true if this instance is applied; otherwise, false default=false
        required: false
        schema:
          type: boolean
      - name: overThreshold
        in: query
        description: indicates if the threshold value is applied when over or under. true if this instance is applied; otherwise, false default=false.
        required: false
        schema:
          type: boolean
      - name: thresholdValue
        in: query
        description: the threshold filter value. default=0.0
        required: false
        schema:
          type: number
          format: double
      - name: businessHoursId
        in: query
        description: business hour filter to apply, default=do not apply
        required: false
        schema:
          type: integer
          format: int32
      - name: rollupByDevice
        in: query
        description: report at device level and not individual resources, default=false, report individual resources
        required: false
        schema:
          type: boolean
      - name: pageId
        in: query
        description: the pageId, empty will return first page
        required: false
        schema:
          type: string
      - name: limit
        in: query
        description: limit the number of entries per page, is also limited by service. 0 or empty will give the maximum number per page
        required: false
        schema:
          type: integer
          format: int32
      - name: Authorization
        in: header
        description: oauth2 access_token
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PageResult_List_CpuUtilization'
            text/json:
              schema:
                $ref: '#/components/schemas/PageResult_List_CpuUtilization'
      security:
      - oauth2: []
