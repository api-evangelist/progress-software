    MonthlyAdvanceSchedule:
      description: "Recur monthly advance\n            \nThe event can be schedule x occurence a day (Monday...Sunday) of the month and repeated every n months.\n            \nShortest schedule is every month\nLongest schedule is once every 12 months or once a year.\n            \nThe day of the month chosen is the x occurence of that day in the month.\nFor example, 3rd Monday, 2nd Tuesday, etc."
      type: object
      properties:
        repeat:
          format: int32
          description: 'Recurring interval, number of months

            ie, recur every (1,2...) months'
          type: integer
        occurence:
          description: recur week of a month
          enum:
          - first
          - second
          - third
          - fourth
          - last
          type: string
        dayOfWeek:
          description: Day of the week
          enum:
          - sunday
          - monday
          - tuesday
          - wednesday
          - thursday
          - friday
          - saturday
          type: string
