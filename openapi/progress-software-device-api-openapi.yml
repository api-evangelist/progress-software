        hostName:
          description: 'Ip or Host/Dns name for network interface, required

            Must be a valid ip, host name or dns name.'
          type: string
        address:
          description: 'ip for network interface, required

            Must be a valid ip address'
          type: string
        defaultInterface:
          description: 'this network interface is the default interface for the device, default: false'
          type: boolean
        pollUsingName:
          description: 'when using this interface to poll, use hostname field instead of address. default: false'
          type: boolean
    DeviceTemplateBatch:
      description: Provide a set of device templates to be applied
      type: object
