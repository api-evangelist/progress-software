openapi: 3.2.0
info:
  version: v1
  title: WhatsUp Gold Device API
  x-logo:
    url: images/wug_logo.svg
  description: '**Version 2026.0**


    *Use WhatsUp Gold REST API to deploy network and device monitoring and management scripts.*


    !'
servers:
- url: https://10.40.67.158:9644
tags:
- name: Device
paths:
  /api/v1/devices/{deviceId}/attributes/{attributeId}:
    get:
      tags:
      - Device
      summary: Return individual attribute
      operationId: Device_GetAttribute
      parameters:
      - name: deviceId
        in: path
        description: ID of device
        required: true
        schema:
          type: string
      - name: attributeId
        in: path
        description: ID of attribute to return
        required: true
        schema:
          type: string
      - name: Authorization
        in: header
        description: oauth2 access_token
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Result_DeviceAttribute'
            text/json:
              schema:
                $ref: '#/components/schemas/Result_DeviceAttribute'
      security:
      - oauth2: []
    put:
      tags:
      - Device
      summary: Update individual attribute
      operationId: Device_UpdateAttribute
      parameters:
      - name: deviceId
        in: path
        description: ID of device to update
        required: true
        schema:
          type: string
      - name: attributeId
        in: path
        description: ID of attribute to update
        required: true
        schema:
          type: string
      - name: name
        in: query
        description: name of device attribute
        required: true
        schema:
          type: string
      - name: value
        in: query
        description: value for device attribute
        required: false
        schema:
          type: string
      - name: Authorization
        in: header
        description: oauth2 access_token
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Result_SuccessResult'
            text/json:
              schema:
                $ref: '#/components/schemas/Result_SuccessResult'
      security:
      - oauth2: []
    delete:
      tags:
      - Device
      summary: Delete individual attribute
      operationId: Device_DeleteAttribute
      parameters:
      - name: deviceId
        in: path
        description: ID of device
        required: true
        schema:
          type: string
      - name: attributeId
        in: path
        description: ID of attribute to delete
        required: true
        schema:
          type: string
      - name: Authorization
        in: header
        description: oauth2 access_token
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Result_SuccessResult'
            text/json:
              schema:
                $ref: '#/components/schemas/Result_SuccessResult'
      security:
      - oauth2: []
  /api/v1/devices/{deviceId}/attributes/-:
    get:
      tags:
      - Device
      summary: Return list of attributes for device
      operationId: Device_FindAttributes
      parameters:
      - name: deviceId
        in: path
        description: ID of the device
        required: true
        schema:
          type: string
      - name: names
        in: query
        description: List of attribute names to return. If empty, all attributes will be returned
        required: false
        style: form
        explode: true
        schema:
          type: array
          items:
            type: string
      - name: nameContains
        in: query
        description: Filter and return only attributes with names that contain this value. If empty all attributes will pass
        required: false
        schema:
          type: string
      - name: valueContains
        in: query
        description: Filter and return only attributes with values that contain this value. If empty all attributes will pass
        required: false
        schema:
          type: string
      - name: pageId
        in: query
        description: page to return
        required: false
        schema:
          type: string
      - name: limit
        in: query
        description: max number of attributes/values
        required: false
        schema:
          type: integer
          format: int32
      - name: Authorization
        in: header
        description: oauth2 access_token
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PageResult_List_DeviceAttribute'
            text/json:
              schema:
                $ref: '#/components/schemas/PageResult_List_DeviceAttribute'
      security:
      - oauth2: []
    post:
      tags:
      - Device
      summary: Add attribute to device
      operationId: Device_AddAttribute
      parameters:
      - name: deviceId
        in: path
        description: ID of device to add an attribute to
        required: true
        schema:
          type: string
      - name: name
        in: query
        description: name of new attribute
        required: true
        schema:
          type: string
      - name: value
        in: query
        description: value of new attribute
        required: false
        schema:
          type: string
      - name: Authorization
        in: header
        description: oauth2 access_token
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Result_DeviceAttribute'
            text/json:
              schema:
                $ref: '#/components/schemas/Result_DeviceAttribute'
      security:
      - oauth2: []
    delete:
      tags:
      - Device
      summary: Delete all attributes from device
      operationId: Device_DeleteAllAttributes
      parameters:
      - name: deviceId
        in: path
        description: ID for device that attributes should be deleted from
        required: true
        schema:
          type: string
      - name: names
        in: query
        description: List of attribute names to delete. If empty, all attributes will be considered
        required: false
        style: form
        explode: true
        schema:
          type: array
          items:
            type: string
      - name: nameContains
        in: query
        description: List of attributes with names that contain this value. If empty all attributes will be considered
        required: false
        style: form
        explode: true
        schema:
          type: array
          items:
            type: string
      - name: valueContains
        in: query
        description: List of attributes with values that contain this value. Adding an empty string will match attributes with no content. If empty list all attributes will be considered
        required: false
        style: form
        explode: true
        schema:
          type: array
          items:
            type: string
      - name: Authorization
        in: header
        description: oauth2 access_token
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Result_CountedSuccessResult'
            text/json:
              schema:
                $ref: '#/components/schemas/Result_CountedSuccessResult'
      security:
      - oauth2: []
    patch:
      tags:
      - Device
      summary: Batch attribute operations (remove, add, modify) for given device
      operationId: Device_BatchAttributes
      parameters:
      - name: deviceId
        in: path
        description: ID for device
        required: true
        schema:
          type: string
      - name: Authorization
        in: header
        description: oauth2 access_token
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Result_CountedSuccessResult'
            text/json:
              schema:
                $ref: '#/components/schemas/Result_CountedSuccessResult'
      security:
      - oauth2: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BulkDeviceAttributeBatch'
          text/json:
            schema:
              $ref: '#/components/schemas/BulkDeviceAttributeBatch'
        description: Attribute operations to apply to device
        required: true
  /api/v1/devices/{deviceId}/group/{groupId}:
    delete:
      tags:
      - Device
      summary: Remove a group assignment for device
      description: 'This function will error if the last static device group assignment is attempted to be removed.

        This function will error if a dynamic or dyname layer2 group assignment is attempt to be removed'
      operationId: Device_DeleteAssignedGroup
      parameters:
      - name: deviceId
        in: path
        description: device to retrieve assigned groups for
        required: true
        schema:
          type: string
      - name: groupId
        in: path
        description: group to remove device from
        required: true
        schema:
          type: string
      - name: Authorization
        in: header
        description: oauth2 access_token
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResult'
            text/json:
              schema:
                $ref: '#/components/schemas/SuccessResult'
      security:
      - oauth2: []
  /api/v1/devices/{deviceId}/group/-:
    get:
      tags:
      - Device
      summary: Return device group assignments for a device
      operationId: Device_DeviceGroupAssignments
      parameters:
      - name: deviceId
        in: path
        description: device the device group assignments are associated with
        required: true
        schema:
          type: string
      - name: view
        in: query
        description: how much information for the group, default=summary
        required: false
        schema:
          type: string
          enum:
          - id
          - summary
          - detail
      - name: type
        in: query
        description: type of groups to retrieve, default=all
        required: false
        schema:
          type: string
          enum:
          - all
          - static_group
          - dynamic_group
          - layer2
      - name: search
        in: query
        description: return only groups that contain this string in display name. Case-insensitive, empty value is ignored
        required: false
        schema:
          type: string
      - name: pageId
        in: query
        description: page of data to return
        required: false
        schema:
          type: string
      - name: limit
        in: query
        description: maximum number of items per page
        required: false
        schema:
          type: integer
          format: int32
      - name: Authorization
        in: header
        description: oauth2 access_token
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PageResult_List_DeviceGroupSummary'
            text/json:
              schema:
                $ref: '#/components/schemas/PageResult_List_DeviceGroupSummary'
      security:
      - oauth2: []
    put:
      tags:
      - Device
      summary: Assign group to a device
      operationId: Device_AssignDeviceGroup
      parameters:
      - name: deviceId
        in: path
        description: device being operated on
        required: true
        schema:
          type: string
      - name: Authorization
        in: header
        description: oauth2 access_token
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResult'
            text/json:
              schema:
                $ref: '#/components/schemas/SuccessResult'
      security:
      - oauth2: []
      requestBody:
        content:
          application/json:
            schema:
              type: string
          text/json:
            schema:
              type: string
        description: group to assign
        required: true
    patch:
      tags:
      - Device
      summary: Batch attribute operations (remove, add) for given device
      operationId: Device_PatchDeviceGroupAssignment
      parameters:
      - name: deviceId
        in: path
        description: device being operatored on
        required: true
        schema:
          type: string
      - name: Authorization
        in: header
        description: oauth2 access_token
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Result_CountedSuccessResult'
            text/json:
              schema:
                $ref: '#/components/schemas/Result_CountedSuccessResult'
      security:
      - oauth2: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BulkDeviceGroupAssignmentBatch'
          text/json:
            schema:
              $ref: '#/components/schemas/BulkDeviceGroupAssignmentBatch'
        description: Device group assignment operations to apply to device
        required: true
  /api/v1/devices/{deviceId}/group/{groupId}/is-member:
    get:
      tags:
      - Device
      summary: Return sucessful if a device is assigned to a group
      operationId: Device_DeviceHasGroupAssignments
      parameters:
      - name: deviceId
        in: path
        description: device being looked at
        required: true
        schema:
          type: string
      - name: groupId
        in: path
        description: group being looked for
        required: true
        schema:
          type: string
      - name: Authorization
        in: header
        description: oauth2 access_token
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResult'
            text/json:
              schema:
                $ref: '#/components/schemas/SuccessResult'
      security:
      - oauth2: []
  /api/v1/devices/{deviceId}/interfaces/default:
    get:
      tags:
      - Device
      summary: Return device's default network interface
      operationId: Device_GetDefaultInterface
      parameters:
      - name: deviceId
        in: path
        description: ID of device
        required: true
        schema:
          type: string
      - name: Authorization
        in: header
        description: oauth2 access_token
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Result_NetworkInterface'
            text/json:
              schema:
                $ref: '#/components/schemas/Result_NetworkInterface'
      security:
      - oauth2: []
  /api/v1/devices/{deviceId}/interfaces/{interfaceId}:
    get:
      tags:
      - Device
      summary: Return individual network interface
      operationId: Device_GetInterface
      parameters:
      - name: deviceId
        in: path
        description: ID of device
        required: true
        schema:
          type: string
      - name: interfaceId
        in: path
        description: ID of interface to return
        required: true
        schema:
          type: string
      - name: Authorization
        in: header
        description: oauth2 access_token
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Result_NetworkInterface'
            text/json:
              schema:
                $ref: '#/components/schemas/Result_NetworkInterface'
      security:
      - oauth2: []
    put:
      tags:
      - Device
      summary: Update individual interface
      operationId: Device_UpdateNetworkInterface
      parameters:
      - name: deviceId
        in: path
        description: ID of device to update
        required: true
        schema:
          type: string
      - name: interfaceId
        in: path
        description: ID of network interface to update
        required: true
        schema:
          type: string
      - name: Authorization
        in: header
        description: oauth2 access_token
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Result_NetworkInterface'
            text/json:
              schema:
                $ref: '#/components/schemas/Result_NetworkInterface'
      security:
      - oauth2: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NetworkInterfaceUpdate'
          text/json:
            schema:
              $ref: '#/components/schemas/NetworkInterfaceUpdate'
        description: changed to be made to interface
        required: true
    delete:
      tags:
      - Device
      summary: Delete individual interface
      operationId: Device_DeleteNetworkInterface
      parameters:
      - name: deviceId
        in: path
        description: ID of device
        required: true
        schema:
          type: string
      - name: interfaceId
        in: path
        description: ID of interface to delete
        required: true
        schema:
          type: string
      - name: Authorization
        in: header
        description: oauth2 access_token
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Result_SuccessResult'
            text/json:
              schema:
                $ref: '#/components/schemas/Result_SuccessResult'
      security:
      - oauth2: []
  /api/v1/devices/{deviceId}/interfaces/-:
    get:
      tags:
      - Device
      summary: Return list of network interfaces for device
      operationId: Device_FindNetworkInterfaces
      parameters:
      - name: deviceId
        in: path
        description: ID of the device
        required: true
        schema:
          type: string
      - name: search
        in: query
        description: optional search text ; case-insensitive ; searches the address and hostname for partial matches
        required: false
        schema:
          type: string
      - name: pageId
        in: query
        description: page to return
        required: false
        schema:
          type: string
      - name: limit
        in: query
        description: max number of network interfaces
        required: false
        schema:
          type: integer
          format: int32
      - name: Authorization
        in: header
        description: oauth2 access_token
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PageResult_List_NetworkInterface'
            text/json:
              schema:
                $ref: '#/components/schemas/PageResult_List_NetworkInterface'
      security:
      - oauth2: []
    post:
      tags:
      - Device
      summary: Add a network interface to device
      operationId: Device_AddNetworkInterface
      parameters:
      - name: deviceId
        in: path
        description: ID of device to add a network interface to
        required: true
        schema:
          type: string
      - name: Authorization
        in: header
        description: oauth2 access_token
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Result_NetworkInterface'
            text/json:
              schema:
                $ref: '#/components/schemas/Result_NetworkInterface'
      security:
      - oauth2: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NetworkInterfaceData'
          text/json:
            schema:
              $ref: '#/components/schemas/NetworkInterfaceData'
        description: interface to add
        required: true
    delete:
      tags:
      - Device
      summary: Delete from device, all network interfaces except default interface
      operationId: Device_DeleteAllNetworkInterfaces
      parameters:
      - name: deviceId
        in: path
        description: ID for device that network interfaces should be deleted from
        required: true
        schema:
          type: string
      - name: Authorization
        in: header
        description: oauth2 access_token
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Result_SuccessResult'
            text/json:
              schema:
                $ref: '#/components/schemas/Result_SuccessResult'
      security:
      - oauth2: []
    patch:
      tags:
      - Device
      summary: Batch network interface operations (remove, add, modify) for a given device
      operationId: Device_BatchNetworkInterfaces
      parameters:
      - name: deviceId
        in: path
        description: ID for device
        required: true
        schema:
          type: string
      - name: Authorization
        in: header
        description: oauth2 access_token
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Result_CountedSuccessResult'
            text/json:
              schema:
                $ref: '#/components/schemas/Result_CountedSuccessResult'
      security:
      - oauth2: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BulkNetworkInterfaceBatch'
          text/json:
            schema:
              $ref: '#/components/schemas/BulkNetworkInterfaceBatch'
        description: Network interface operations to apply to device
        required: true
  /api/v1/devices/{deviceId}/credentials/{credentialId}:
    delete:
      tags:
      - Device
      summary: Remove an assigned credential from a device
      operationId: Device_DeleteAssignedCredentials
      parameters:
      - name: deviceId
        in: path
        description: device to retrieve credentials from
        required: true
        schema:
          type: string
      - name: credentialId
        in: path
        description: credential to be unassigned
        required: true
        schema:
          type: string
      - name: preventOrphanActiveMonitors
        in: query
        description: prevent operation if an active monitor will be orphaned, default=true
        required: false
        schema:
          type: boolean
      - name: Authorization
        in: header
        description: oauth2 access_token
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResult'
            text/json:
              schema:
                $ref: '#/components/schemas/SuccessResult'
      security:
      - oauth2: []
  /api/v1/devices/{deviceId}/credentials/-:
    get:
      tags:
      - Device
      summary: Return assigned credentials for a device
      operationId: Device_Credentials
      parameters:
      - name: deviceId
        in: path
        description: device to retrieve credentials from
        required: true
        schema:
          type: string
      - name: view
        in: query
        description: how much information for the credential, default=basic
        required: false
        schema:
          type: string
          enum:
          - id
          - basic
          - summary
          - details
      - name: type
        in: query
        description: type of credential to retrieve, default=all
        required: false
        schema:
          type: string
          enum:
          - all
          - snmp
          - windows
          - ado
          - telnet
          - ssh
          - vmware
          - jmx
          - smis
          - aws
          - azure
          - meraki
          - restapi
          - ubiquiti
          - redfish
      - name: Authorization
        in: header
        description: oauth2 access_token
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Result_List_Credential'
            text/json:
              schema:
                $ref: '#/components/schemas/Result_List_Credential'
      security:
      - oauth2: []
    put:
      tags:
      - Device
      summary: Assign a credential to a device
      operationId: Device_DeviceAssignCredentials
      parameters:
      - name: deviceId
        in: path
        description: device be operated on
        required: true
        schema:
          type: string
      - name: Authorization
        in: header
        description: oauth2 access_token
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResult'
            text/json:
              schema:
                $ref: '#/components/schemas/SuccessResult'
      security:
      - oauth2: []
      requestBody:
        content:
          application/json:
            schema:
              type: string
          text/json:
            schema:
              type: string
        description: credential to assign
        required: true
    delete:
      tags:
      - Device
      summary: Remove assigned credentials from a device by type
      operationId: Device_DeleteDeviceAssignedCredentials
      parameters:
      - name: deviceId
        in: path
        description: device to remove credentials from
        required: true
        schema:
          type: string
      - name: type
        in: query
        description: kind of credential to be unassigned, default=all
        required: false
        schema:
          type: string
          enum:
          - all
          - snmp
          - windows
          - ado
          - telnet
          - ssh
          - vmware
          - jmx
          - smis
          - aws
          - azure
          - meraki
          - restapi
          - ubiquiti
          - redfish
      - name: preventOrphanActiveMonitors
        in: query
        description: prevent operation if an active monitor will be orphaned, default=true
        required: false
        schema:
          type: boolean
      - name: Authorization
        in: header
        description: oauth2 access_token
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResult'
            text/json:
              schema:
                $ref: '#/components/schemas/SuccessResult'
      security:
      - oauth2: []
  /api/v1/devices/{deviceId}/monitors/{assignmentId}:
    get:
