          format: date-time
          description: "Indicates the end date for when the device will no longer \nbe in manual maintenance"
          type: string
        reason:
          description: Indicates the Reason for the Maintenance (Max 250 Characters)
          maxLength: 250
          minLength: 0
          type: string
    DaysOfTheWeek:
      description: 'Day of the week,

        Set each day of the week the event should happen on to true.

        To be valid, at least one day of the week must be set to true.'
      type: object
      properties:
        sunday:
          description: Sunday
          type: boolean
        monday:
