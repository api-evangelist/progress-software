    BulkDeviceAttributeBatch:
      description: The set of devices attributes to be operated on
      type: object
      properties:
        deleteAllAttributes:
          description: 'remove all attributes from device

            Optional. This will be applied first.'
          type: boolean
        attributesToDelete:
          description: 'The list of attribute ids to remove from device. Attribute Id not found on device will be skipped.

            Optional. This will be applied second.'
          type: array
          items:
            type: string
        attributeNamesToDelete:
          description: 'The list of attribute names to remove from device. case insensitive

            Optional. This list will be applied thrid'
          type: array
          items:
            type: string
        attributeNameContainsToDelete:
          description: 'If attribute names contains one of these values. Case insensitive.

            Optional. This list will be applied third'
          type: array
          items:
            type: string
        attributeValueContainsToDelete:
          description: 'If attribute value contains one of these values. Case insensitive.

            Optional. This list will be applied thrid'
          type: array
          items:
            type: string
        attributeToModify:
          description: 'The list of device attributes to modify

            Optional. This list will be applied fourth'
          type: array
          items:
            $ref: '#/components/schemas/DeviceAttributeModifier'
        attributesToAdd:
          description: 'The list of device attributes add to device

            Optional. This list will be applied last'
          type: array
          items:
            $ref: '#/components/schemas/DeviceAttributeNameValue'
    DeviceAttributeNameValue:
      description: The devices attributes for add operations
      type: object
      properties:
