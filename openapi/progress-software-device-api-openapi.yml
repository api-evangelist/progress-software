    MonthlySchedule:
      description: "Recur monthly\n            \nThe event can be schedule on a particular day of the month and repeated every x months.\n            \nShortest schedule is every month\nLongest schedule is once every 12 months or once a year.\n            \nIf the day of the month the event is to be fired on does not have 29, 30 or 31 days,\nthen the event is fired on the last day of the month.\n            \nday:\n    first can be used to indicated the 1st day of the month,\n    last can be used to indicated the last day of the month."
      type: object
      properties:
        repeat:
          format: int32
          description: 'Recurring interval, number of months

            ie, recur every (1,2...) months'
          type: integer
        day:
          description: 'day of the month to fire the event.

            1-31 will happen on the explicit day

            "first" will be first day of the month

            "last" will be last day of the month'
          type: string
    DeviceOverview:
