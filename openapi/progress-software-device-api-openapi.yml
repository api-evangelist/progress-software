  /api/v1/devices/{deviceId}/config/template:
    get:
      tags:
      - Device
      summary: Returns a template for the device
      description: 'This is a summary of the device''s configuration settings including references to credentials, monitors, groups, etc.


        Options:

        * all: all basic options are included. (default)

        * l2: include layer 2 data such as inventory, links and other information used by the system

        * tempip: use ip address as the template id instead of the database identifier.

        * simple: return all data in it simplest form, dropping items like parents, classid, etc.


        Basic Options:

        * action: include device action

        * active: include active monitors

        * attribute: include device attributes

        * brand: include brand

        * creds: include credentials

        * custom: include custom links

        * dependency: include dependencies

        * devicetype: include device type

        * groups: include group memberships

        * interface: include network interfaces

        * note: include device note

        * oid: include SNMP system oid

        * os: include OS Role

        * passive: include passive monitors

        * perf: include performance monitors

        * polling-interval: include Device Level polling interval

        * refresh: include refresh settings

        * roles: include device roles and sub roles.

        * task: include NCM tasks'
      operationId: Device_GetTemplate
      parameters:
      - name: deviceId
        in: path
        description: The id of the device
        required: true
        schema:
          type: string
      - name: options
        in: query
        description: empty is the default set of options. Multiple options may be passed separated by commas
        required: false
        schema:
          type: string
      - name: Authorization
        in: header
        description: oauth2 access_token
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Result_DeviceTemplateReadResults'
            text/json:
              schema:
                $ref: '#/components/schemas/Result_DeviceTemplateReadResults'
      security:
      - oauth2: []
  /api/v1/devices/-/config/template:
    patch:
      tags:
      - Device
      summary: Apply a set of device templates
      description: 'Each template will create a new device in the system. If a template can only be partially applied,

        an error will be returned for the template.


        Options:

        * all: all basic options are applied (default)

        * l2: apply layer 2 data such as inventory, links and other information used by the system

        * update: after applying templates, issue a refresh request for all new devices

        * update-interface-state: after applying templates, issue a rescan request to enable or disable Interface Active Monitors

        * update-interface-names: after applying templates, issue a rescan request to update names for Interface Active Monitors

        * update-active-monitors: after applying templates, issue a rescan request to apply the "Use in rescan" options for Active Monitors


        Basic:

        * action: apply device action

        * active: apply active monitors

        * attribute: apply device attributes

        * brand: apply brand

        * creds: apply credentials

        * custom: apply custom links

        * dependency: apply dependencies

        * devicetype: apply device type

        * groups: apply group memberships

        * interface: apply network interfaces

        * note: apply device note

        * oid: apply SNMP system oid

        * os: apply OS Role

        * passive: apply passive monitors

        * perf: apply performance monitors

        * polling-interval: apply Device Level polling interval

        * refresh: apply refresh settings

        * roles: apply device roles and sub roles.

        * task: apply NCM tasks'
      operationId: Device_ApplyTemplates
      parameters:
      - name: Authorization
        in: header
        description: oauth2 access_token
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Result_ApplyTemplateResults'
            text/json:
              schema:
                $ref: '#/components/schemas/Result_ApplyTemplateResults'
      security:
      - oauth2: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeviceTemplateBatch'
          text/json:
            schema:
              $ref: '#/components/schemas/DeviceTemplateBatch'
        description: Set of templates for creating new devices
        required: true
  /api/v1/devices/{deviceId}:
    get:
