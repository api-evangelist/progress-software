            type: string
        templates:
          description: 'Set of templates to be applied. All templates will attempt to create a new device.

            No attempt will be made to match a device'
          type: array
          items:
            $ref: '#/components/schemas/DeviceTemplate'
    DevicePollingConfigUpdate:
      description: Update general polling values
