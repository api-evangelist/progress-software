openapi: 3.2.0
info:
  title: Progress Software Users API
  x-refined-note:
  - x-logo differs across the merged source definitions and was not carried
  - x-swagger-net-version differs across the merged source definitions and was not carried
  version: '1.0'
  description: 'Operations tagged users across 2 of this provider''s published API definitions: progress-software-chef-automate-openapi-original.json, progress-software-moveit-transfer-openapi-original.json. Each path carries the servers of the definition it was published in.'
servers:
- url: https://automate.chef.io
- url: https://127.0.0.1
tags:
- description: IAM local users are not attached to external identity providers. They can be members of IAM teams and IAM policies.
  name: Users
  x-displayName: IAM Users
paths:
  /apis/iam/v2/self/{id}:
    put:
      description: 'Updates a local user''s own name or password.

        If changing the password, both "password" and "previous_password" are required.


        Authorization Action:

        ```

        iam:usersSelf:update

        ```'
      tags:
      - Users
      summary: Update self (as user)
      operationId: Users_UpdateSelf
      parameters:
      - description: ID of the user. Cannot be changed. Used to sign in.
        name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/chef.automate.api.iam.v2.UpdateSelfResp'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/grpc.gateway.runtime.Error'
      x-code-samples:
      - lang: JSON
        source: '{"name": "My New Name", "password": "aNewSafePassword", "previous_password": "aPreviousSafePassword"}'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/chef.automate.api.iam.v2.UpdateSelfReq'
        required: true
    servers:
    - url: https://automate.chef.io
  /apis/iam/v2/users:
    get:
      description: 'Lists all local users.


        Authorization Action:

        ```

        iam:users:list

        ```'
      tags:
      - Users
      summary: List all users
      operationId: Users_ListUsers
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/chef.automate.api.iam.v2.ListUsersResp'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/grpc.gateway.runtime.Error'
    post:
      description: 'Creates a local user that can sign in to Automate and be a member of IAM teams

        and IAM policies.


        Authorization Action:

        ```

        iam:users:create

        ```'
      tags:
      - Users
      summary: Create a user
      operationId: Users_CreateUser
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/chef.automate.api.iam.v2.CreateUserResp'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/grpc.gateway.runtime.Error'
      x-code-samples:
      - lang: JSON
        source: '{"name": "Display Name", "id": "username001rulez", "password": "aSafePassword"}'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/chef.automate.api.iam.v2.CreateUserReq'
        required: true
    servers:
    - url: https://automate.chef.io
  /apis/iam/v2/users/{id}:
    get:
      description: 'Returns the details for a local user.


        Authorization Action:

        ```

        iam:users:get

        ```'
      tags:
      - Users
      summary: Get a user
      operationId: Users_GetUser
      parameters:
      - description: ID of the user.
        name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/chef.automate.api.iam.v2.GetUserResp'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/grpc.gateway.runtime.Error'
    put:
      description: 'Updates a local user''s name or password.


        Authorization Action:

        ```

        iam:users:update

        ```'
      tags:
      - Users
      summary: Update a user
      operationId: Users_UpdateUser
      parameters:
      - description: ID of the user. Cannot be changed. Used to sign in.
        name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/chef.automate.api.iam.v2.UpdateUserResp'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/grpc.gateway.runtime.Error'
      x-code-samples:
      - lang: JSON
        source: '{"name": "New Name", "password": "aSafePassword"}'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/chef.automate.api.iam.v2.UpdateUserReq'
        required: true
    delete:
      description: 'Deletes a local user.


        Authorization Action:

        ```

        iam:users:delete

        ```'
      tags:
      - Users
      summary: Delete a user
      operationId: Users_DeleteUser
      parameters:
      - description: ID of the user.
        name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/chef.automate.api.iam.v2.DeleteUserResp'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/grpc.gateway.runtime.Error'
    servers:
    - url: https://automate.chef.io
