  /api/v1/users/{Id}/groups:
    get:
      tags:
      - Users
      summary: Get list of user groups
      operationId: GETapi/v1/users/{Id}/groups?Page={Page}&PerPage={PerPage}-1.0
      parameters:
      - name: Id
        in: path
        description: User ID.
        required: true
        schema:
          type: string
      - name: page
        in: query
        description: Page number to display
        required: false
        schema:
          type: integer
          format: int32
      - name: perPage
        in: query
        description: Items per page in result collection; Default is 25
        required: false
        schema:
          type: integer
          format: int32
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PagedModelOfUserGroupModel'
            text/json:
              schema:
