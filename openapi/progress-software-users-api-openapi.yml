            text/json:
              schema:
                $ref: '#/components/schemas/ErrorModel'
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorModel'
      security:
      - Authorization: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterExternalTokenRequest'
          text/json:
            schema:
              $ref: '#/components/schemas/RegisterExternalTokenRequest'
          application/problem+json:
            schema:
              $ref: '#/components/schemas/RegisterExternalTokenRequest'
        description: Request to register an external token with the current user account.
        required: true
    delete:
      tags:
      - Users
      summary: Delete external token of the current user using the encoded token string
      operationId: DELETEapi/v1/users/self/externaltokens-1.0
      responses:
        '204':
          description: No Content
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Void'
            text/json:
              schema:
                $ref: '#/components/schemas/Void'
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Void'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorModel'
            text/json:
              schema:
                $ref: '#/components/schemas/ErrorModel'
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorModel'
        '500':
          description: Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorModel'
            text/json:
              schema:
                $ref: '#/components/schemas/ErrorModel'
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorModel'
      security:
      - Authorization: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CurrentUserDeleteExternalTokenByTokenRequest'
          text/json:
            schema:
              $ref: '#/components/schemas/CurrentUserDeleteExternalTokenByTokenRequest'
          application/problem+json:
            schema:
              $ref: '#/components/schemas/CurrentUserDeleteExternalTokenByTokenRequest'
        description: Request to delete an external token using the encoded token string.
        required: true
    servers:
    - url: https://127.0.0.1
  /api/v1/users/{Id}/externaltokens:
    get:
      tags:
      - Users
      summary: Get user external tokens
      operationId: GETapi/v1/users/{Id}/externaltokens?Page={Page}&PerPage={PerPage}&SortField={SortField}&SortDirection={SortDirection}-1.0
      parameters:
      - name: Id
        in: path
        description: User ID.
        required: true
        schema:
          type: string
      - name: page
        in: query
        description: Page number to display
        required: false
        schema:
          type: integer
          format: int32
      - name: perPage
        in: query
        description: Items per page in result collection; Default is 25
        required: false
        schema:
          type: integer
          format: int32
      - name: sortField
        in: query
        description: Name of field to sort the results by. (TokenId, LastUsed, RegisteredAt or TokenType); Default is DisplayName.
        required: false
        schema:
          type: string
      - name: sortDirection
        in: query
        description: Sort direction; Default is ascending.
        required: false
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PagedModelOfUserExternalTokenModel'
            text/json:
              schema:
                $ref: '#/components/schemas/PagedModelOfUserExternalTokenModel'
            application/problem+json:
              schema:
