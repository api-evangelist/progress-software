              schema:
                $ref: '#/components/schemas/ErrorModel'
            text/json:
              schema:
                $ref: '#/components/schemas/ErrorModel'
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorModel'
      security:
      - Authorization: []
    servers:
    - url: https://127.0.0.1
  /api/v1/users:
    get:
      tags:
      - Users
      summary: Get list of users
      operationId: GETapi/v1/users?Page={Page}&PerPage={PerPage}&SortField={SortField}&SortDirection={SortDirection}&Permission={Permission}&Status={Status}&Username={Username}&FullName={FullName}&Email={Email}&IsExactMatch={IsExactMatch}&OrgId={OrgId}-1.0
      parameters:
      - name: page
        in: query
        description: Page number to display.
        required: false
        schema:
          type: integer
          format: int32
      - name: perPage
        in: query
        description: Items per page in result collection; Default is 25.
        required: false
        schema:
          type: integer
          format: int32
      - name: sortField
        in: query
        description: Name of field to sort the results by. (username, fullname, lastLoginStamp or email); Default is username.
        required: false
        schema:
          type: string
      - name: sortDirection
        in: query
        description: Sort direction; Default is ascending.
        required: false
        schema:
          type: string
      - name: permission
        in: query
        description: User permission filter.
        required: false
        schema:
          type: string
          enum:
          - AllUsers
          - EndUsers
          - Administrators
          - FileAdmins
          - GroupAdmins
          - TemporaryUsers
          - SysAdmins
          - AuditUsers
      - name: status
        in: query
        description: User status filter.
        required: false
        schema:
          type: string
          enum:
          - AllUsers
          - ActiveUsers
          - InactiveUsers
          - NeverSignedOnUsers
          - TemplateUsers
      - name: username
        in: query
        description: User login name.
        required: false
        schema:
          type: string
      - name: fullName
        in: query
        description: User full name.
        required: false
        schema:
          type: string
      - name: email
        in: query
        description: User email.
        required: false
        schema:
          type: string
      - name: isExactMatch
        in: query
        description: If true, it will search for exact match of username, fullname and email.
        required: false
        schema:
          type: boolean
      - name: orgId
        in: query
        description: Organization ID. (For sysadmin users only. For non sysadmin users current user organization ID is used.)
        required: false
        schema:
          type: integer
          format: int32
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PagedModelOfSimpleUserModel'
            text/json:
              schema:
                $ref: '#/components/schemas/PagedModelOfSimpleUserModel'
            application/problem+json:
              schema:
                $ref: '#/components/schemas/PagedModelOfSimpleUserModel'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorModel'
            text/json:
              schema:
                $ref: '#/components/schemas/ErrorModel'
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorModel'
        '500':
          description: Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorModel'
            text/json:
              schema:
                $ref: '#/components/schemas/ErrorModel'
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorModel'
      security:
      - Authorization: []
    post:
      tags:
      - Users
      summary: Create new user
      description: If SourceUserId specified in user model clone operation will be executed
      operationId: POSTapi/v1/users-1.0
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserDetailsModel'
            text/json:
              schema:
                $ref: '#/components/schemas/UserDetailsModel'
            application/problem+json:
              schema:
                $ref: '#/components/schemas/UserDetailsModel'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorModel'
            text/json:
              schema:
                $ref: '#/components/schemas/ErrorModel'
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorModel'
        '500':
          description: Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorModel'
            text/json:
