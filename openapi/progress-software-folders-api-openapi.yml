openapi: 3.2.0
info:
  version: '1'
  title: MOVEit Transfer REST Folders API
  x-swagger-net-version: 8.5.28.001
  x-logo:
    url: images/MOVEitLogo.svg
  description: '**Release 2025.1**, **version 17.01**


    *MOVEit securely collects, stores, manages, and distributes information within organizations, between businesses, and more...*


    > **Important!**

    The REST API is an optionally licensed feature that runs at the MOVEit Transfer Server.'
servers:
- url: https://127.0.0.1
tags:
- name: Folders
paths:
  /api/v1/folders:
    get:
      tags:
      - Folders
      summary: Get list of folders current user can view
      operationId: GETapi/v1/folders-1.0
      parameters:
      - name: name
        in: query
        description: File name mask for filtering list of Folders
        required: false
        schema:
          type: string
      - name: path
        in: query
        description: File path mask for filtering list of Folders
        required: false
        schema:
          type: string
      - name: page
        in: query
        description: Page number to display
        required: false
        schema:
          type: integer
          format: int32
      - name: perPage
        in: query
        description: Items per page in result collection; Default is 25
        required: false
        schema:
          type: integer
          format: int32
      - name: sortField
        in: query
        description: Name of field to sort the results by. (Name, Type or Path); Default is Path.
        required: false
        schema:
          type: string
      - name: sortDirection
        in: query
        description: Sort direction; Default is ascending.
        required: false
        schema:
          type: string
      - name: sharedTo
        in: query
        required: false
        style: form
        explode: true
        schema:
          type: array
          items:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PagedModelOfSimpleFolderModel'
            text/json:
              schema:
                $ref: '#/components/schemas/PagedModelOfSimpleFolderModel'
            application/problem+json:
              schema:
                $ref: '#/components/schemas/PagedModelOfSimpleFolderModel'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorModel'
            text/json:
              schema:
                $ref: '#/components/schemas/ErrorModel'
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorModel'
        '500':
          description: Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorModel'
            text/json:
              schema:
                $ref: '#/components/schemas/ErrorModel'
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorModel'
      security:
      - Authorization: []
  /api/v1/folders/{Id}:
    get:
      tags:
      - Folders
      summary: Return folder details
      operationId: GETapi/v1/folders/{Id}?SkipCounts={SkipCounts}&SkipFilesSize={SkipFilesSize}&PathHash={PathHash}-1.0
      parameters:
      - name: Id
        in: path
        description: Folder ID
        required: true
        schema:
          type: string
      - name: skipCounts
        in: query
        description: 'Whether to skip including counts of various folder properties like files

          and subfolders in the folder details results.'
        required: false
        schema:
          type: boolean
      - name: skipFilesSize
        in: query
        description: Whether to skip including total files size in a directory and its subdirectories(if any).
        required: false
        schema:
          type: boolean
      - name: pathHash
        in: query
        description: File path hash for getting proper folder relations
        required: false
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FolderDetailsModel'
            text/json:
              schema:
                $ref: '#/components/schemas/FolderDetailsModel'
            application/problem+json:
              schema:
                $ref: '#/components/schemas/FolderDetailsModel'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorModel'
            text/json:
              schema:
                $ref: '#/components/schemas/ErrorModel'
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorModel'
        '500':
          description: Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorModel'
            text/json:
              schema:
                $ref: '#/components/schemas/ErrorModel'
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorModel'
      security:
      - Authorization: []
    delete:
      tags:
      - Folders
      summary: Delete folder
      operationId: DELETEapi/v1/folders/{Id}?PathHash={PathHash}-1.0
      parameters:
      - name: Id
        in: path
        description: Folder ID
        required: true
        schema:
          type: string
      - name: pathHash
        in: query
        description: File path hash for getting proper folder relations
        required: false
        schema:
          type: string
      responses:
        '204':
          description: No Content
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Void'
            text/json:
              schema:
                $ref: '#/components/schemas/Void'
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Void'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorModel'
            text/json:
              schema:
                $ref: '#/components/schemas/ErrorModel'
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorModel'
        '500':
          description: Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorModel'
            text/json:
              schema:
                $ref: '#/components/schemas/ErrorModel'
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorModel'
      security:
      - Authorization: []
    patch:
      tags:
      - Folders
      summary: Partial Folder update
      operationId: PATCHapi/v1/folders/{Id}-1.0
      parameters:
      - name: Id
        in: path
        description: ID of the folder to update
        required: true
        schema:
          type: integer
          format: int32
      responses:
