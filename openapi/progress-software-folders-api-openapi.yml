            text/json:
              schema:
                $ref: '#/components/schemas/ErrorModel'
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorModel'
      security:
      - Authorization: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FolderPatchModel'
          text/json:
            schema:
              $ref: '#/components/schemas/FolderPatchModel'
          application/problem+json:
            schema:
              $ref: '#/components/schemas/FolderPatchModel'
        description: Request body.
        required: true
