          - Any
          - UpWithDownMonitors
      - name: search
        in: query
        description: optional search text ; case-insensitive ; searches the display name, hostname and network address
        required: false
        schema:
          type: string
      - name: pageId
        in: query
        description: The pageId
        required: false
        schema:
          type: string
      - name: limit
        in: query
        description: The limit for the page
        required: false
        schema:
          type: integer
          format: int32
      - name: Authorization
        in: header
