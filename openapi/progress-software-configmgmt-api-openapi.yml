    chef.automate.api.cfgmgmt.response.Rollout:
      description: 'A Rollout represents the process of distributing Chef Infra code (with

        Policyfiles) to a set of nodes. It''s used to track which nodes have run the

        latest version of the Chef Infra code assigned to them and also provide the

        user insights about the code by aggregating Chef Client run results

        according to the version of Chef Infra code applied. Metadata about the code

        is stored in order to provide the user with convenient references back to

        systems they already use (such as SCM and Ci/CD systems) to manage their code.


        Nodes are segmented by a triple of policy name, policy group, and policy domain URL:

        policy name generally describes what kind of system it is, e.g., a database server

        policy group generally describes where the system fits in the user''s code

        lifecycle, e.g., "QA" or "production." Policy groups may also represent a

        subset of nodes within a code lifecycle stage, such as a "production-canary"

        group.

        policy domain URL identifies the system that distributes the Chef Infra code

        and is the owner of the namespaces for policy name and group. E.g., a Chef

        Server URL with the `/organizations/:orgname` part.


        There is one (or zero) revision(s) of the Chef Infra code applied to any

        segment at a time. Rollouts track the changes to which revision of the code is

        applied to the node segments over time.'
      type: object
      properties:
        ci_job_id:
          description: 'If the rollout was initiated by Ci/CD or similar system, the id of the job

            that initiated the rollout. Should include the Ci system''s nickname or

            other identifying information users would need to associate the job ID to

            the Ci/CD system.'
          type: string
        ci_job_url:
          description: 'If the rollout was initiated via Ci/CD or similar system, the web URL

            for the job that initiated the rollout.'
          type: string
        description:
          description: 'A free-form description of the rollout, as given by the user. Long

            messages may be displayed in a truncated form in the UI. The content may

            be entered manually by the user or extracted from another system, for

            example a git commit message.'
          type: string
        end_time:
          description: The time that the rollout was replaced with another rollout.
          type: string
        id:
          description: 'The system-generated ID for this rollout. The system currently provides

            autoincrementing integers for the Ids.'
          type: string
        policy_domain_url:
          description: 'In the Chef Server case, the policy domain URL is the Chef Server URL

            with the `/organizations/:orgname` portion of the URL path included. In

            general, this can be a URL for any content storage/distribution service,

            as long as the combination of policy_name and policy_node_group is unique

            on that system.


            The set of nodes configured to fetch policy content from the

            policy_domain_url and configured with the same policy_name and

            policy_node_group form the target set of nodes for a rollout and are

            expected to apply the policy revision described by the rollout.'
          type: string
        policy_domain_username:
          description: 'The username of the entity who uploaded/promoted the policy code to the

            code host. In a Chef Server architecture, this is the name of the Chef

            Server user who ran the `chef push` command to upload the policy.'
          type: string
        policy_name:
          type: string
          title: The name of the policy, i.e., the `name` attribute in the Policyfile
        policy_node_group:
          description: 'The group of nodes which are targeted by the rollout. In the Chef Server

            case, this is the policy_group to which the user is pushing the policy.'
          type: string
        policy_revision_id:
          type: string
          title: The revision_id of the compiled policy being rolled out
        policy_scm_commit:
          description: 'The source control system''s identifier for the repository version. This

            should be the version where the policy''s lockfile was committed.'
          type: string
        policy_scm_url:
          type: string
          title: The URL used to obtain a copy of the source code repository
        policy_scm_web_url:
          type: string
          title: The URL used to view the source code repository via the web
        scm_author_email:
          description: 'The email address of the author of the most recent commit to the source

            code repository. In git, this is the setting `user.email`.'
          type: string
        scm_author_name:
          description: 'The username of the author of the most recent commit to the source code

            repository. In git, this is the setting `user.name`.'
          type: string
        scm_type:
          title: The source control system used with the policyfile
          $ref: '#/components/schemas/chef.automate.api.cfgmgmt.response.SCMType'
        scm_web_type:
          title: The software/service used to host the source code repository
          $ref: '#/components/schemas/chef.automate.api.cfgmgmt.response.SCMWebType'
        start_time:
          description: 'The time that the rollout began. Whenever a new rollout is created, it

            becomes the "current" rollout for its node segment; that is, any nodes

            that start a Chef Infra Client run will run the policy revision described

            by this "current" rollout. The system will populate the previously current

            rollout''s `end_time` attribute with the current time.'
          type: string
    chef.automate.api.cfgmgmt.response.CookbookLock:
      type: object
      properties:
        cookbook:
          description: Cookbook name.
          type: string
        policy_identifier:
          description: Policy identifier for the cookbook lock.
          type: string
    chef.automate.api.cfgmgmt.response.GetNodesUsageCountResponse:
      type: object
      properties:
        days_since_last_post:
          type: string
          format: int64
          title: number of days since telematics was last posted
        node_cnt:
          type: string
          format: int64
          title: unique nodes count in a duration
    chef.automate.api.cfgmgmt.response.Resource:
      type: object
      properties:
        conditional:
          description: Conditional rule associated with the resource.
          type: string
        cookbook_name:
          description: Cookbook name associated with the resource.
          type: string
        cookbook_version:
          description: Version of the cookbook associated with the resource.
          type: string
        delta:
          description: Change diff for the resource (if it was changed during the run).
          type: string
        duration:
          description: Duration of the resource processing.
          type: string
        error:
          description: Chef Error information, available on failed runs.
          $ref: '#/components/schemas/chef.automate.api.cfgmgmt.response.ChefError'
        id:
          description: Id of the resource.
          type: string
        ignore_failure:
          description: Boolean that denotes whether or not the resource failure should be ignored.
          type: boolean
        name:
          description: Name for the resource.
          type: string
        recipe_name:
          description: Name of the recipe associated with the resource.
          type: string
        result:
          description: String result of the resource.
          type: string
        status:
          description: Status of the resource (e.g. 'up-to-date').
          type: string
        type:
          description: Resource type.
          type: string
    chef.automate.api.cfgmgmt.request.SCMType:
      type: string
      default: SCM_TYPE_UNSPECIFIED
      enum:
      - SCM_TYPE_UNSPECIFIED
      - SCM_TYPE_UNKNOWN_SCM
      - SCM_TYPE_GIT
    chef.automate.api.cfgmgmt.response.CreateRolloutTest:
      type: object
    chef.automate.api.cfgmgmt.response.NodeSegmentRolloutProgress:
      type: object
      properties:
        current_rollout_progress:
          $ref: '#/components/schemas/chef.automate.api.cfgmgmt.response.CurrentRolloutProgress'
        policy_domain_url:
          type: string
        policy_name:
          type: string
          title: 'policy_name, policy_node_group, policy_domain_url make up a "compound

            id" for the node segment'
        policy_node_group:
          type: string
        previous_rollouts:
          type: array
          title: 'This is the last, say 2 or 4 rollouts before the current one (to give a

            total of 3 or 5)'
          items:
            $ref: '#/components/schemas/chef.automate.api.cfgmgmt.response.PastRolloutProgress'
        total_nodes:
          type: integer
          format: int32
          title: total nodes in elasticsearch in the node segment
    chef.automate.api.cfgmgmt.response.Rollouts:
      type: object
      properties:
        rollouts:
          type: array
          items:
            $ref: '#/components/schemas/chef.automate.api.cfgmgmt.response.Rollout'
    grpc.gateway.runtime.Error:
      type: object
      properties:
        code:
          type: integer
          format: int32
        details:
          type: array
          items:
            $ref: '#/components/schemas/google.protobuf.Any'
        error:
          type: string
        message:
          type: string
    chef.automate.api.cfgmgmt.request.UpdateTelemetryReportedRequest:
      type: object
      properties:
        last_telemetry_reported_at:
          type: string
          title: last client run telemetry reported date
    chef.automate.api.cfgmgmt.response.ExpandedRunList:
      type: object
      properties:
        id:
          description: Id of the run list collection.
          type: string
        run_list:
          description: Intentionally blank.
          type: array
          items:
            $ref: '#/components/schemas/chef.automate.api.cfgmgmt.response.RunList'
