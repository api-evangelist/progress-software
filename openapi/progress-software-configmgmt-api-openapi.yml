openapi: 3.2.0
info:
  description: '# Authentication

    The Chef Automate API typically uses an API token passed in the header of your API request.'
  title: Chef Automate API Documentation Config Mgmt API
  termsOfService: https://www.chef.io/terms-and-conditions-of-use/
  contact:
    url: https://www.chef.io/support/
    email: support@chef.io
  license:
    name: Apache 2.0
    url: https://github.com/chef/automate/blob/main/LICENSE
  version: version not set
  x-logo:
    altText: Chef logo
    url: /images/chef-automate-logo.svg
servers:
- url: https://automate.chef.io
tags:
- name: ConfigMgmt
  x-displayName: Nodes
paths:
  /api/beta/cfgmgmt/rollouts/create:
    post:
      description: 'Creates a Rollout record. A rollout represents the process of nodes acquiring

        the latest policy revision pushed to a policy group.


        Authorization Action:

        ```

        ingest:unifiedEvents:create

        ```'
      tags:
      - ConfigMgmt
      summary: CreateRollout
      operationId: ConfigMgmt_CreateRollout
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/chef.automate.api.cfgmgmt.response.Rollout'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/grpc.gateway.runtime.Error'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/chef.automate.api.cfgmgmt.request.CreateRollout'
        required: true
  /api/beta/cfgmgmt/rollouts/find:
    get:
      description: 'Returns the rollout for the given Chef Server/org, policy group, policy name, and policy revision


        Authorization Action:

        ```

        infra:nodes:list

        ```'
      tags:
      - ConfigMgmt
      summary: GetRolloutForChefRun
      operationId: ConfigMgmt_GetRolloutForChefRun
      parameters:
      - name: policy_name
        in: query
        schema:
          type: string
      - name: policy_group
        in: query
        schema:
          type: string
      - name: policy_revision_id
        in: query
        schema:
          type: string
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/chef.automate.api.cfgmgmt.response.Rollout'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/grpc.gateway.runtime.Error'
  /api/beta/cfgmgmt/rollouts/list:
    get:
      description: 'Gives a list of rollouts


        Authorization Action:

        ```

        infra:nodes:list

        ```'
      tags:
      - ConfigMgmt
      summary: GetRollouts
      operationId: ConfigMgmt_GetRollouts
      parameters:
      - description: Filters to apply to the request for the rollouts list.
        name: filter
        in: query
        style: form
        explode: true
        schema:
          type: array
          items:
            type: string
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/chef.automate.api.cfgmgmt.response.Rollouts'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/grpc.gateway.runtime.Error'
  /api/beta/cfgmgmt/rollouts/progress_by_node_segment:
    get:
      tags:
      - ConfigMgmt
      operationId: ConfigMgmt_ListNodeSegmentsWithRolloutProgress
      parameters:
      - description: Filters to apply to the request for the node segments list.
        name: filter
        in: query
        style: form
        explode: true
        schema:
          type: array
          items:
            type: string
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/chef.automate.api.cfgmgmt.response.NodeSegmentsWithRolloutProgress'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/grpc.gateway.runtime.Error'
      summary: Config mgmt list node segments with rollout progress
      x-summary-source: derived
  /api/beta/cfgmgmt/rollouts/rollout/{rollout_id}:
    get:
      description: 'Returns the rollout with the given Id


        Authorization Action:

        ```

        infra:nodes:list

        ```'
      tags:
      - ConfigMgmt
      summary: GetRolloutById
      operationId: ConfigMgmt_GetRolloutById
      parameters:
      - name: rollout_id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/chef.automate.api.cfgmgmt.response.Rollout'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/grpc.gateway.runtime.Error'
  /api/beta/cfgmgmt/rollouts/test_create:
    post:
      description: 'CreateRolloutTest is a no-op endpoint that has the same auth requirements as

        CreateRollout. It can be used to verify end-to-end config/connectivity for

        clients


        Authorization Action:

        ```

        ingest:unifiedEvents:create

        ```'
      tags:
      - ConfigMgmt
      summary: CreateRolloutTest
      operationId: ConfigMgmt_CreateRolloutTest
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/chef.automate.api.cfgmgmt.response.CreateRolloutTest'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/grpc.gateway.runtime.Error'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/chef.automate.api.cfgmgmt.request.CreateRolloutTest'
        required: true
  /api/v0/cfgmgmt/errors:
    get:
      description: 'Returns a list of the most common errors reported for infra nodes'' most recent Chef Infra Client runs.


        Authorization Action:

        ```

        infra:nodes:list

        ```'
      tags:
      - ConfigMgmt
      summary: List Errors
      operationId: ConfigMgmt_GetErrors
      parameters:
      - description: 'The number of results to return.

          If set to zero, the default size of 10 will be used. Set to a negative

          value for unlimited results.'
        name: size
        in: query
        schema:
          type: integer
          format: int32
      - description: 'Filters in the request select the nodes from which the errors are

          collected. The same filters may be specified for this request as for other

          Nodes requests, with the exception of ''status'' which is not valid for this

          request.'
        name: filter
        in: query
        style: form
        explode: true
        schema:
          type: array
          items:
            type: string
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/chef.automate.api.cfgmgmt.response.Errors'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/grpc.gateway.runtime.Error'
  /api/v0/cfgmgmt/node_metadata_counts:
    get:
      description: 'For each type of field requested this returns distinct values the amount of each. For example,

        if the ''platform'' field is requested ''windows'' 10, ''redhat'' 5, and ''ubuntu'' 8 could be returned.

        The number next to each represents the number of nodes with that type of platform.


        Example:

        request

        ```

        cfgmgmt/node_metadata_counts?type=platform&type=status

        ```

        response

        ```

        {

        "types": [

        {

        "values": [

        {

        "value": "mac_os_x 10.11.5",

        "count": 28

        },

        {

        "value": "linux 8.9",

        "count": 1

        },

        {

        "value": "macos 8.9",

        "count": 1

        },

        {

        "value": "windows 8.9",

        "count": 1

        }

        ],

        "type": "platform"

        },

        {

        "value": [

        {

        "value": "missing",

        "count": 29

        },

        {

        "value": "failure",

        "count": 2

        }

        ],

        "type": "status"

        }

        ]

        }

        ```


        Authorization Action:

        ```

        infra:nodes:list

        ```'
      tags:
      - ConfigMgmt
      summary: GetNodeMetadataCounts
      operationId: ConfigMgmt_GetNodeMetadataCounts
      parameters:
      - description: Types of node fields to collect value counts for.
        name: type
        in: query
        style: form
        explode: true
        schema:
          type: array
          items:
            type: string
      - description: Filters to apply to the counts returned.
        name: filter
        in: query
        style: form
        explode: true
        schema:
          type: array
          items:
            type: string
      - description: Earliest most recent check-in node information to return.
        name: start
        in: query
        schema:
          type: string
      - description: Latest most recent check-in node information to return.
        name: end
        in: query
        schema:
          type: string
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/chef.automate.api.cfgmgmt.response.NodeMetadataCounts'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/grpc.gateway.runtime.Error'
  /api/v0/cfgmgmt/node_runs_daily_status_time_series:
    get:
      description: 'Provides the status of runs for each 24-hour duration. For multiple runs in one 24-hour duration,

        the most recent failed run will be returned. If there are no failed runs the most recent successful

        run will be returned. If no runs are found in the 24-hour duration, the status will be "missing"

        and no run information will be returned.


        Example:

        request

        ```

        cfgmgmt/node_runs_daily_status_time_series?node_id=507bd518-5c18-4c2d-a445-60fe7dde9961&days_ago=3

        ```

        response

        ```

        {

        "durations": [

        {

        "start": "2020-04-25T19:00:00Z",

        "end": "2020-04-26T18:59:59Z",

        "status": "missing",

        "run_id": ""

        },

        {

        "start": "2020-04-26T19:00:00Z",

        "end": "2020-04-27T18:59:59Z",

        "status": "missing",

        "run_id": ""

        },

        {

        "start": "2020-04-27T19:00:00Z",

        "end": "2020-04-28T18:59:59Z",

        "status": "failure",

        "run_id": "b7904f41-68b5-44ec-9da6-cf2481ff8600"

        }

        ]

        }

        ```


        Authorization Action:

        ```

        infra:nodes:list

        ```'
      tags:
      - ConfigMgmt
      summary: GetNodeRunsDailyStatusTimeSeries
      operationId: ConfigMgmt_GetNodeRunsDailyStatusTimeSeries
      parameters:
      - description: Node ID of the runs.
        name: node_id
        in: query
        schema:
          type: string
      - description: Number of past days.
        name: days_ago
        in: query
        schema:
          type: integer
          format: int32
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/chef.automate.api.cfgmgmt.response.NodeRunsDailyStatusTimeSeries'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/grpc.gateway.runtime.Error'
  /api/v0/cfgmgmt/nodes:
    get:
      description: 'Returns a list of infra nodes that have checked in to Automate.

        Adding a filter makes a list of all nodes that meet the filter criteria.

        Filters for the same field are ORd together, while filters across different fields are ANDed together.

        Supports pagination, filtering (with wildcard support), and sorting.

        Max return payload size is 4MB, use pagination to fetch remaining data.


        Example:

        ```

        cfgmgmt/nodes?pagination.page=1&pagination.size=100&sorting.field=name&sorting.order=ASC&filter=name:mySO*&filter=platform:ubun*

        ```


        Authorization Action:

        ```

        infra:nodes:list

        ```'
      tags:
      - ConfigMgmt
      summary: List Checked-in Nodes
      operationId: ConfigMgmt_GetNodes
      parameters:
      - description: Filters to apply to the request for nodes list.
        name: filter
        in: query
        style: form
        explode: true
        schema:
          type: array
          items:
            type: string
      - description: Page number of the results to return.
        name: pagination.page
        in: query
        schema:
          type: integer
          format: int32
      - description: Amount of results to include per page.
        name: pagination.size
        in: query
        schema:
          type: integer
          format: int32
      - description: Field to sort the list results on.
        name: sorting.field
        in: query
        schema:
          type: string
      - description: Order the results should be returned in.
        name: sorting.order
        in: query
        schema:
          type: string
          enum:
          - ASC
          - DESC
          default: ASC
      - description: Earliest most recent check-in node information to return.
        name: start
        in: query
        schema:
          type: string
      - description: Latest most recent check-in node information to return.
        name: end
        in: query
        schema:
          type: string
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/grpc.gateway.runtime.Error'
  /api/v0/cfgmgmt/nodes/export:
    post:
      description: 'Stream nodes in JSON (default) or CSV format.


        Supports filtering and sorting, but not pagination.


        Include the value `csv` for the `output_type` parameter in the request to receive CSV formatted data.

        Include the value `json` for the `output_type` parameter in the request to receive JSON formatted data.

        Include the value `0` to sort descending.

        Include the value `1` to sort ascending.

        Example:


        ```''{"output_type":"csv","sorting":{"order": 1, "field": "name"},"filters":[{"status":"success","environment":"prod", "organization:chef"}]}''```'
      tags:
      - ConfigMgmt
      summary: NodeExport
      operationId: NodeExport
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/chef.automate.api.common.ExportData'
            text/csv:
              schema:
                $ref: '#/components/schemas/chef.automate.api.common.ExportData'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/chef.automate.api.cfgmgmt.request.NodeExport'
        required: true
  /api/v0/cfgmgmt/nodes/{node_id}/attribute:
    get:
      description: 'Returns the latest reported attributes for the provided node ID.


        Authorization Action:

        ```

        infra:nodes:get

        ```'
      tags:
      - ConfigMgmt
      summary: Show Attributes
      operationId: ConfigMgmt_GetAttributes
      parameters:
      - description: Chef guid for the requested node.
        name: node_id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/chef.automate.api.cfgmgmt.response.NodeAttribute'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/grpc.gateway.runtime.Error'
  /api/v0/cfgmgmt/nodes/{node_id}/runs:
    get:
      description: 'Returns a list of run metadata (id, start and end time, and status) for the provided node ID.

        Supports pagination.

        Accepts a `start` parameter to denote start date for the list and a filter of type `status`.


        Authorization Action:

        ```

        infra:nodes:list

        ```'
      tags:
      - ConfigMgmt
      summary: List Run Details
      operationId: ConfigMgmt_GetRuns
      parameters:
      - description: Chef guid for the node.
        name: node_id
        in: path
        required: true
        schema:
          type: string
      - description: Filters to apply to the request for runs list.
        name: filter
        in: query
        style: form
        explode: true
        schema:
          type: array
          items:
            type: string
      - description: Page number of the results to return.
        name: pagination.page
        in: query
        schema:
          type: integer
          format: int32
      - description: Amount of results to include per page.
        name: pagination.size
        in: query
        schema:
          type: integer
          format: int32
      - description: Earliest (in history) run information to return for the runs list.
        name: start
        in: query
        schema:
          type: string
      - description: Latest (in history) run information to return for the runs list.
        name: end
        in: query
        schema:
          type: string
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/grpc.gateway.runtime.Error'
  /api/v0/cfgmgmt/nodes/{node_id}/runs/{run_id}:
    get:
      description: 'Returns the infra run report for the provided node ID and run ID.


        Authorization Action:

        ```

        infra:nodes:get

        ```'
      tags:
      - ConfigMgmt
      summary: Show Node Run
      operationId: ConfigMgmt_GetNodeRun
      parameters:
      - description: Chef guid for the requested node.
        name: node_id
        in: path
        required: true
        schema:
          type: string
      - description: Run id for the node.
        name: run_id
        in: path
        required: true
        schema:
          type: string
      - description: End time on the node's run.
        name: end_time
        in: query
        schema:
          type: string
          format: date-time
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/chef.automate.api.cfgmgmt.response.Run'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/grpc.gateway.runtime.Error'
  /api/v0/cfgmgmt/organizations:
    get:
      description: 'Returns a list of all organizations associated with nodes that have checked in to Automate.


        Authorization Action:

        ```

        infra:nodes:list

        ```'
      tags:
      - ConfigMgmt
      summary: List Organizations
      operationId: ConfigMgmt_GetOrganizations
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/grpc.gateway.runtime.Error'
  /api/v0/cfgmgmt/policy_revision/{revision_id}:
    get:
      description: 'Returns Policy Names with a list of cookbook names and associated policy identifiers based on a policy revision ID.

        Policy revision IDs are sent with an infra run report and identifies which instance of a policy the node used for this run.


        Authorization Action:

        ```

        infra:nodes:list

        ```'
      tags:
      - ConfigMgmt
      summary: List Policy Cookbooks
      operationId: ConfigMgmt_GetPolicyCookbooks
      parameters:
      - description: Revision id for the policy.
        name: revision_id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/chef.automate.api.cfgmgmt.response.PolicyCookbooks'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/grpc.gateway.runtime.Error'
  /api/v0/cfgmgmt/reports/export:
    post:
      description: 'Stream node run reports in JSON (default) or CSV format.


        Supports filtering, but not pagination or sorting.


        Include the value `csv` for the `output_type` parameter in the request to receive CSV formatted data.

        Include the value `json` for the `output_type` parameter in the request to receive JSON formatted data.

        Include the node ID for the `node_id` for the reports to receive.

        Include the number of seconds since the Unix Epoch for the `start` and `end` fields.

        Example:


        ```''{"output_type":"csv"node_id":"80e73cf5-32eb-3556-ac99-6597274a8522","start":{"seconds":1585336095},"end":{"seconds":1585337095},"filters":[{"status":"success"}]}''```'
      tags:
      - ConfigMgmt
      summary: ReportExport
      operationId: ReportExport
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/chef.automate.api.common.ExportData'
            text/csv:
              schema:
                $ref: '#/components/schemas/chef.automate.api.common.ExportData'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/chef.automate.api.cfgmgmt.request.ReportExport'
        required: true
  /api/v0/cfgmgmt/source_fqdns:
    get:
      description: 'Returns a list of all Chef Infra Servers associated with nodes that have checked in to Automate.


        Authorization Action:

        ```

        infra:nodes:list

        ```'
      tags:
      - ConfigMgmt
      summary: List Associated Chef Infra Servers
      operationId: ConfigMgmt_GetSourceFqdns
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/grpc.gateway.runtime.Error'
  /api/v0/cfgmgmt/stats/checkin_counts_timeseries:
    get:
      description: 'Returns a daily time series of unique node check-ins for the number of days requested.

        If `days ago` value is empty, API will return the default 1 day ago results.


        Authorization Action:

        ```

        infra:nodes:list

        ```'
      tags:
      - ConfigMgmt
      summary: List Node Checkins
      operationId: ConfigMgmt_GetCheckInCountsTimeSeries
      parameters:
      - description: List of filters to be applied to the time series.
        name: filter
        in: query
        style: form
        explode: true
        schema:
          type: array
          items:
            type: string
      - description: Number of past days to create the time series.
        name: days_ago
        in: query
        schema:
          type: integer
          format: int32
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/chef.automate.api.cfgmgmt.response.CheckInCountsTimeSeries'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/grpc.gateway.runtime.Error'
  /api/v0/cfgmgmt/stats/missing_node_duration_counts:
    get:
      description: 'Returns a count of missing nodes for the provided durations.


        Example:

        ```

        cfgmgmt/stats/missing_node_duration_counts?durations=3d&durations=1w&durations=2w&durations=1M&durations=3M

        ```


        Authorization Action:

        ```

        infra:nodes:list

        ```'
      tags:
      - ConfigMgmt
      summary: List Missing Nodes Count
      operationId: ConfigMgmt_GetMissingNodeDurationCounts
      parameters:
      - description: "A valid duration is any number zero or greater with one of these characters 'h', 'd', 'w', or 'M'. \n'h' is hours\n'd' is days\n'w' is weeks\n'M' is months\nWill contain one or many."
        name: durations
        in: query
        style: form
        explode: true
        schema:
          type: array
          items:
            type: string
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/chef.automate.api.cfgmgmt.response.MissingNodeDurationCounts'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/grpc.gateway.runtime.Error'
  /api/v0/cfgmgmt/stats/node_counts:
    get:
      description: 'Returns totals for failed, success, missing, and overall total infra nodes that have reported into Automate.

        Supports filtering.


        Example:

        ```

