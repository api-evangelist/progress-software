openapi: 3.2.0
info:
  description: '# Authentication

    The Chef Automate API typically uses an API token passed in the header of your API request.'
  title: Chef Automate API Documentation Telemetry API
  termsOfService: https://www.chef.io/terms-and-conditions-of-use/
  contact:
    url: https://www.chef.io/support/
    email: support@chef.io
  license:
    name: Apache 2.0
    url: https://github.com/chef/automate/blob/main/LICENSE
  version: version not set
  x-logo:
    altText: Chef logo
    url: /images/chef-automate-logo.svg
servers:
- url: https://automate.chef.io
tags:
- name: Telemetry
  x-displayName: Telemetry
paths:
  /api/v0/telemetry/config:
    get:
      tags:
      - Telemetry
      operationId: Telemetry_GetTelemetryConfiguration
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/chef.automate.api.telemetry.TelemetryResponse'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/grpc.gateway.runtime.Error'
      summary: Telemetry get telemetry configuration
      x-summary-source: derived
components:
  schemas:
    chef.automate.api.telemetry.TelemetryResponse:
      type: object
      properties:
        customer_id:
          type: string
        customer_name:
          type: string
        deployment_id:
          type: string
        deployment_type:
          type: string
        license_id:
          type: string
        license_type:
          type: string
        max_nodes:
          type: string
          format: int64
        telemetry_enabled:
          type: boolean
        telemetry_url:
          type: string
    grpc.gateway.runtime.Error:
      type: object
      properties:
        code:
          type: integer
          format: int32
        details:
          type: array
          items:
            $ref: '#/components/schemas/google.protobuf.Any'
        error:
          type: string
        message:
          type: string
    google.protobuf.Any:
      type: object
      properties:
        type_url:
          type: string
        value:
          type: string
          format: byte
  securitySchemes:
    APIToken:
      description: Authenticate with the Automate API using an API Token.
      type: apiKey
      name: api-token
      in: header
