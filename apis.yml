- aid: progress-software:progress-software-policies-api
  name: Progress Software Policies API
  description: A policy defines permissions for who may perform what action on which resources, based
    on the project. The 'who' is a user, a team, or a system. A policy has three components, the agent,
    the action, and the project. The agent is a user, team, or system. Users and teams are designated
    by name while systems communicate with Chef Automate using pre-authorized API tokens. Actions are
    activities that agents can take in relation to Chef Automate's content and operation. Projects are
    collections of resources, such as API tokens or ingested compliance nodes.
