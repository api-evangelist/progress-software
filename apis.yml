aid: progress-software
name: Progress Software
description: 'Progress Software Corporation (NASDAQ: PRGS) is a Burlington, Massachusetts enterprise software
  company that builds and acquires infrastructure and digital-experience products. Its portfolio spans
  application development and data (OpenEdge, MarkLogic, Semaphore, DataDirect, Corticon, Nuclia agentic
  RAG), digital experience (Sitefinity CMS, Sitefinity Insight), developer tooling and UI components (Telerik,
  Kendo UI, Fiddler, Test Studio), secure file transfer and collaboration (MOVEit, ShareFile), infrastructure
  automation and monitoring (Chef, WhatsUp Gold, Flowmon, LoadMaster by Kemp). Most of its API surface
  is shipped inside self-hosted products — MOVEit Transfer, WhatsUp Gold and Chef Automate each publish
  a full Swagger 2.0 contract against the customer''s own installation — alongside SaaS surfaces such
  as the ShareFile OData API and Sitefinity''s headless OData services.'
image: https://www.progress.com/images/default-source/default-album/progress-album/images-album/social-image.png
url: https://raw.githubusercontent.com/api-evangelist/progress-software/refs/heads/main/apis.yml
x-type: company
x-source: harvest:absent-parent
specificationVersion: '0.20'
created: '2026-09-13'
modified: '2026-09-16'
position: Producing
tags:
- Company
- Enterprise Software
- Managed File Transfer
- Infrastructure Automation
- Network Monitoring
- Content Management
- Developer Tools
- Data Platform
- Application Development
- DevOps
- Agentic RAG
- File Sharing
apis:
- aid: progress-software:progress-software-sharefile
  name: ShareFile API v3
  description: The ShareFile API v3 is the OData-based REST interface of Progress ShareFile, covering
    Items, Folders, Accounts, Users, Groups, Shares, Access Controls, Capabilities, Connector Groups,
    Devices, Encrypted Emails, Favorites, Folder Templates, Metadata, Policies, Reports, Sessions, Storage
    Centers, Workflows, Zones, Async Operations and Webhook Clients/Subscriptions. It is OAuth 2.0 authenticated
    and served per-tenant from the account subdomain.
  humanURL: https://api.sharefile.com/
  baseURL: https://{subdomain}.sf-api.com/sf/v3
  tags:
  - File Sharing
  - Document Workflow
  - Collaboration
  - E-Signature
  tags_raw:
  - File Sharing
  - Document Workflow
  - Collaboration
  - eSignature
  properties:
  - type: DeveloperPortal
    url: https://api.sharefile.com/
  - type: APIReference
    url: https://api.sharefile.com/docs
  - type: GettingStarted
    url: https://api.sharefile.com/gettingstarted/quickstart
  - type: Webhooks
    url: asyncapi/progress-software-sharefile-webhooks.yml
  image: https://www.sharefile.com/images/sharefilelibraries/default-album/sharefile-og-image.png
- aid: progress-software:progress-software-sitefinity-odata
  name: Sitefinity CMS Headless OData Services
  description: Sitefinity CMS exposes its content as OData v4 web services under a configurable service
    route (by default /api/default) on the customer's own Sitefinity instance. The headless API serves
    content types, taxonomies, pages, media and custom modules with full OData query syntax ($select,
    $expand, $filter, $orderby), bearer-token authentication and a $metadata document that is the machine-readable
    contract for each installation.
  humanURL: https://www.progress.com/documentation/sitefinity-cms/web-service-routes
  baseURL: https://{sitefinity-host}/api/default
  tags:
  - Content Management
  - Headless CMS
  - OData
  properties:
  - type: Documentation
    url: https://www.progress.com/documentation/sitefinity-cms/web-service-routes
  - type: APIReference
    url: https://www.progress.com/documentation/sitefinity-cms/odata-services-configurations
  image: https://www.progress.com/images/default-source/social-sharing/sitefinity.png?sfvrsn=e7dd87b5_1
