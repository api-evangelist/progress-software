apis:
- aid: progress-software-chef-automate
  name: Chef Automate API
  description: The Chef Automate API is the HTTP surface of Progress Chef Automate, the dashboard and
    control plane for Chef Infra, Chef InSpec and Chef Habitat. It covers configuration management node
    and run history, compliance scanning and reporting, IAM (users, teams, tokens, policies, projects),
    data lifecycle, secrets, notifications, node manager integrations and license management. The published
    Swagger 2.0 contract carries 277 operations across 215 paths.
  humanURL: https://docs.chef.io/automate/api/
  baseURL: https://automate.chef.io
  tags:
  - Compliance
  - Configuration Management
  - DevOps
  - Infrastructure Automation
  properties:
  - type: OpenAPI
    url: openapi/progress-software-chef-automate-openapi-original.json
  - type: Documentation
    url: https://docs.chef.io/automate/
  - type: APIReference
    url: https://docs.chef.io/automate/api/
  image: https://www.chef.io/images/cheflibraries/logos/chef_progress_primary_logo.png
- aid: progress-software-moveit-transfer
  name: MOVEit Transfer REST API
  description: The MOVEit Transfer REST API is an optionally licensed interface that runs at a customer's
    own MOVEit Transfer server. It exposes authentication, files and folders, folder content, users and
    groups, ad-hoc packages, mailboxes, contacts, audit logs, security and miscellaneous server settings,
    reports, organizations, server info and transfer status. The published contract is Swagger 2.0 with
    113 operations across 83 paths and 191 model definitions.
  humanURL: https://docs.ipswitch.com/MOVEit/Transfer2025/Api/Rest/
  baseURL: https://{moveit-transfer-host}/api/v1
  tags:
  - Managed File Transfer
  - File Sharing
  - Security
  properties:
  - type: OpenAPI
    url: openapi/progress-software-moveit-transfer-openapi-original.json
  - type: APIReference
    url: https://docs.ipswitch.com/MOVEit/Transfer2025/Api/Rest/
  - type: Documentation
    url: https://docs.progress.com/category/moveit
  image: https://www.progress.com/images/default-source/social-sharing/moveit.png?sfvrsn=11f5e4a5_1
- aid: progress-software-whatsup-gold
  name: WhatsUp Gold REST API
  description: The WhatsUp Gold REST API is the automation interface of Progress WhatsUp Gold network
    monitoring, served from the customer's own WhatsUp Gold host on port 9644. It covers device discovery
    and management, credentials, monitors and monitor assignments, groups, alert centre, reports, polling
    and product configuration. The published contract is Swagger 2.0 with 168 operations across 121 paths
    and 299 model definitions, secured with an OAuth 2.0 password grant.
  humanURL: https://docs.ipswitch.com/NM/WhatsUpGold2026/02_Guides/rest_api/index.html
  baseURL: https://{whatsupgold-host}:9644/api/v1
  tags:
  - Network Monitoring
  - Infrastructure
  - Observability
  properties:
  - type: OpenAPI
    url: openapi/progress-software-whatsup-gold-openapi-original.json
  - type: APIReference
    url: https://docs.ipswitch.com/NM/WhatsUpGold2026/02_Guides/rest_api/index.html
  - type: Documentation
    url: https://www.whatsupgold.com/rest-api
  image: https://www.whatsupgold.com/images/librariesprovider2/default-album/social-image.png
- aid: progress-software-sharefile
  name: ShareFile API v3
  description: The ShareFile API v3 is the OData-based REST interface of Progress ShareFile, covering
    Items, Folders, Accounts, Users, Groups, Shares, Access Controls, Capabilities, Connector Groups,
    Devices, Encrypted Emails, Favorites, Folder Templates, Metadata, Policies, Reports, Sessions, Storage
    Centers, Workflows, Zones, Async Operations and Webhook Clients/Subscriptions. It is OAuth 2.0 authenticated
    and served per-tenant from the account subdomain.
  humanURL: https://api.sharefile.com/
  baseURL: https://{subdomain}.sf-api.com/sf/v3
  tags:
  - File Sharing
  - Document Workflow
  - Collaboration
  - eSignature
  properties:
  - type: DeveloperPortal
    url: https://api.sharefile.com/
  - type: APIReference
    url: https://api.sharefile.com/docs
  - type: GettingStarted
    url: https://api.sharefile.com/gettingstarted/quickstart
  - type: Webhooks
    url: asyncapi/progress-software-sharefile-webhooks.yml
  image: https://www.sharefile.com/images/sharefilelibraries/default-album/sharefile-og-image.png
- aid: progress-software-sitefinity-odata
  name: Sitefinity CMS Headless OData Services
  description: Sitefinity CMS exposes its content as OData v4 web services under a configurable service
    route (by default /api/default) on the customer's own Sitefinity instance. The headless API serves
    content types, taxonomies, pages, media and custom modules with full OData query syntax ($select,
    $expand, $filter, $orderby), bearer-token authentication and a $metadata document that is the machine-readable
    contract for each installation.
  humanURL: https://www.progress.com/documentation/sitefinity-cms/web-service-routes
  baseURL: https://{sitefinity-host}/api/default
  tags:
  - Content Management
  - Headless CMS
  - OData
  properties:
  - type: Documentation
    url: https://www.progress.com/documentation/sitefinity-cms/web-service-routes
  - type: APIReference
    url: https://www.progress.com/documentation/sitefinity-cms/odata-services-configurations
  image: https://www.progress.com/images/default-source/social-sharing/sitefinity.png?sfvrsn=e7dd87b5_1
