aid: progress-software
name: Progress Software
description: 'Progress Software Corporation (NASDAQ: PRGS) is a Burlington, Massachusetts enterprise software
  company that builds and acquires infrastructure and digital-experience products. Its portfolio spans
  application development and data (OpenEdge, MarkLogic, Semaphore, DataDirect, Corticon, Nuclia agentic
  RAG), digital experience (Sitefinity CMS, Sitefinity Insight), developer tooling and UI components (Telerik,
  Kendo UI, Fiddler, Test Studio), secure file transfer and collaboration (MOVEit, ShareFile), infrastructure
  automation and monitoring (Chef, WhatsUp Gold, Flowmon, LoadMaster by Kemp). Most of its API surface
  is shipped inside self-hosted products — MOVEit Transfer, WhatsUp Gold and Chef Automate each publish
  a full Swagger 2.0 contract against the customer''s own installation — alongside SaaS surfaces such
  as the ShareFile OData API and Sitefinity''s headless OData services.'
image: https://www.progress.com/images/default-source/default-album/progress-album/images-album/social-image.png
