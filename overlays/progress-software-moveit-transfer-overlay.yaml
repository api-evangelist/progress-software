overlay: 1.0.0
info:
  title: API Evangelist enhancements for MOVEit Transfer REST API
  version: 1.0.0
extends: openapi/progress-software-moveit-transfer-openapi-original.json
actions:
- target: $.info
  update:
    x-apievangelist-provider: progress-software
    x-apievangelist-api: MOVEit Transfer REST API
    x-apievangelist-harvested: '2026-09-13'
    x-apievangelist-source: https://docs.ipswitch.com/MOVEit/Transfer2025/Api/Rest/2025_1_OPEN_API_SPEC_FULL.json
    x-apievangelist-deployment: customer-hosted
