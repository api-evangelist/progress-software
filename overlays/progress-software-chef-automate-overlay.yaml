overlay: 1.0.0
info:
  title: API Evangelist enhancements for Chef Automate API
  version: 1.0.0
extends: openapi/progress-software-chef-automate-openapi-original.json
actions:
- target: $.info
  update:
    x-apievangelist-provider: progress-software
    x-apievangelist-api: Chef Automate API
    x-apievangelist-harvested: '2026-09-13'
    x-apievangelist-source: https://docs.chef.io/automate-api-docs/all-apis.swagger.json
    x-apievangelist-deployment: customer-hosted
    x-apievangelist-host-note: Published host is automate.chef.io — Progress's own Automate instance, not the reader's.
      Chef Automate is self-hosted; the real base URL is the customer's installation.
    x-apievangelist-idempotency: none — no idempotency key is declared or documented
    x-apievangelist-rate-limit-signal: none — no RateLimit-*/Retry-After header, no 429 declared
    x-apievangelist-error-format: grpc.gateway.runtime.Error (gRPC status code in `code`, not HTTP)
- target: $
  update:
    x-apievangelist-note: This overlay records API Evangelist observations about the published contract. It never
      mutates the harvested document; apply it to a copy.
