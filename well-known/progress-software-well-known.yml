findings:
- RFC 8414 OAuth 2.0 authorization server metadata is served on six Progress-operated marketing hosts
  (progress.com, telerik.com, chef.io, sharefile.com, whatsupgold.com, kemptechnologies.com). Every one
  is the Sitefinity CMS OAuth surface, issuer = the site itself, authorization/token endpoints under /sitefinity/oauth/.
  This is a real, parsing RFC 8414 document, not an API authorization server for any product API.
- An RFC 9116 security.txt is served on telerik.com (and www.telerik.com) only. It is canonical to https://www.telerik.com/.well-known/security.txt
