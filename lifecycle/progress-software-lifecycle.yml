summary: 'Progress runs a corporate PRODUCT lifecycle policy (Active / Mature-or-Sunset / Retired) and
  no API lifecycle policy. Nothing in the portfolio publishes an API deprecation window, a Sunset or
  Deprecation response header, or a versioned API support horizon. API versions ride the product
  release train: a MOVEit Transfer or WhatsUp Gold REST API version is simply the API that shipped with
  that product release, and it falls out of support when that release does.'
